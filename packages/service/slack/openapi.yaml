components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Envelope:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
        warning:
          type: string
        needed:
          type: string
        provided:
          type: string
        response_metadata:
          type: object
          properties:
            messages:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
    ErrorEnvelope:
      type: object
      required:
      - ok
      - error
      properties:
        ok:
          type: boolean
          enum:
          - false
        error:
          type: string
    Message:
      type: object
      required:
      - type
      - ts
      properties:
        type:
          type: string
          enum:
          - message
        subtype:
          type: string
        text:
          type: string
        user:
          type: string
        bot_id:
          type: string
        app_id:
          type: string
        team:
          type: string
        ts:
          type: string
          x-mockingbird-volatile:
            kind: id
        thread_ts:
          type: string
          x-mockingbird-volatile:
            kind: id
        blocks:
          type: array
          items:
            type: object
        edited:
          type: object
          properties:
            user:
              type: string
            ts:
              type: string
              x-mockingbird-volatile:
                kind: id
        reactions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
              users:
                type: array
                items:
                  type: string
    PostMessageResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          channel:
            type: string
          ts:
            type: string
            x-mockingbird-resource:
              type: message
              identity: true
            x-mockingbird-volatile:
              kind: id
          message:
            $ref: '#/components/schemas/Message'
    ReactionsGetResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          type:
            type: string
            enum:
            - message
          channel:
            type: string
          message:
            $ref: '#/components/schemas/Message'
    UpdateResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          channel:
            type: string
          ts:
            type: string
            x-mockingbird-volatile:
              kind: id
          text:
            type: string
          message:
            $ref: '#/components/schemas/Message'
    EphemeralResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          message_ts:
            type: string
            x-mockingbird-volatile:
              kind: id
    PermalinkResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          channel:
            type: string
          permalink:
            type: string
            x-mockingbird-volatile:
              kind: url
    AuthTestResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          url:
            type: string
          team:
            type: string
          user:
            type: string
          team_id:
            type: string
          user_id:
            type: string
          bot_id:
            type: string
          is_enterprise_install:
            type: boolean
    Channel:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        is_channel:
          type: boolean
        is_private:
          type: boolean
        is_archived:
          type: boolean
        is_member:
          type: boolean
        created:
          type: integer
    JoinResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          channel:
            $ref: '#/components/schemas/Channel'
    User:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          x-mockingbird-resource:
            type: user
            identity: true
        team_id:
          type: string
        name:
          type: string
        real_name:
          type: string
        deleted:
          type: boolean
        is_bot:
          type: boolean
        tz:
          type: string
        profile:
          type: object
          properties:
            email:
              type: string
            real_name:
              type: string
            display_name:
              type: string
    UserResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          user:
            $ref: '#/components/schemas/User'
    File:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          x-mockingbird-resource:
            type: file
            identity: true
        name:
          type: string
        title:
          type: string
        mimetype:
          type: string
        filetype:
          type: string
        size:
          type: integer
        created:
          type: integer
        url_private:
          type: string
        url_private_download:
          type: string
        permalink:
          type: string
    FileResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          file:
            $ref: '#/components/schemas/File'
    ViewResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          view:
            type: object
            properties:
              id:
                type: string
                x-mockingbird-volatile:
                  kind: id
              type:
                type: string
              team_id:
                type: string
              callback_id:
                type: string
              hash:
                type: string
                x-mockingbird-volatile:
                  kind: opaque
              blocks:
                type: array
                items:
                  type: object
              state:
                type: object
              private_metadata:
                type: string
              title:
                type: object
              app_id:
                type: string
              bot_id:
                type: string
