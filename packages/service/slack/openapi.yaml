openapi: 3.1.0
info:
  title: Slack incoming webhooks and Web API (Mockingbird subset)
  description: |
    Stateful mock subset of Slack: incoming webhooks (`POST /services/T/B/X`) and the Web API
    methods our apps call. Every message lands in an outbox a suite can assert on. Hand-authored
    from Slack's documented wire shapes and the consumers (backend `postSlackWebhook`, EMR
    `slack-web-api.ts`, request-intake `SlackClient`, release-conductor).
  version: '1'
  x-mockingbird-upstream:
    note: Hand-authored from https://api.slack.com/methods and https://api.slack.com/messaging/webhooks
      (Slack publishes no maintained OpenAPI for these methods).
servers:
- url: https://slack.com
- url: https://hooks.slack.com
security:
- bearerAuth: []
paths:
  /services/{team}/{bot}/{secret}:
    parameters:
    - name: team
      in: path
      required: true
      schema:
        type: string
        pattern: ^T[A-Z0-9]{2,12}$
    - name: bot
      in: path
      required: true
      schema:
        type: string
        pattern: ^B[A-Z0-9]{2,12}$
    - name: secret
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{8,24}$
    post:
      operationId: PostIncomingWebhook
      summary: 'Incoming webhook: post a message to the hook''s channel'
      description: Answers `200 ok` (text/plain). Bad payloads get Slack's plain-text error codes (`invalid_payload`,
        `no_text`, `invalid_blocks`); an unregistered hook is `404 no_service` once any hook is registered.
        Also accepts form bodies with a `payload=<json>` field.
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 400
                blocks:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required:
                    - type
                    properties:
                      type:
                        type: string
                        enum:
                        - section
                        - divider
                        - header
                        - context
                      text:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - mrkdwn
                            - plain_text
                          text:
                            type: string
                            maxLength: 200
                thread_ts:
                  type: string
                  maxLength: 24
                username:
                  type: string
                  maxLength: 40
                icon_emoji:
                  type: string
                  maxLength: 40
                unfurl_links:
                  type: boolean
      responses:
        '200':
          description: Posted
          content:
            text/plain:
              schema:
                type: string
                enum:
                - ok
        '400':
          description: '`invalid_payload`, `no_text`, `invalid_blocks`, `too_many_attachments`'
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: '`action_prohibited`, `posting_to_general_channel_denied`'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: '`no_service`, `channel_not_found`'
          content:
            text/plain:
              schema:
                type: string
        '410':
          description: '`channel_is_archived`'
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: '`rate_limited`, with `retry-after`'
          headers:
            retry-after:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: '`internal_error`'
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: '`service_unavailable`'
          content:
            text/plain:
              schema:
                type: string
      security: []
  /api/chat.postMessage:
    post:
      operationId: ChatPostMessage
      summary: 'chat.postMessage: post a message (or a thread reply) to a channel'
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Channel id (`C…`) or name (`#alerts`)
                text:
                  type: string
                  maxLength: 400
                blocks:
                  type: string
                  description: JSON-encoded blocks
                  maxLength: 2000
                thread_ts:
                  type: string
                  maxLength: 24
                  x-mockingbird-resource-ref:
                    type: message
                    missing: '1000000000.000000'
              required:
              - channel
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Channel id (`C…`) or name (`#alerts`)
                text:
                  type: string
                  maxLength: 400
                blocks:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required:
                    - type
                    properties:
                      type:
                        type: string
                        enum:
                        - section
                        - divider
                        - header
                        - context
                      text:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - mrkdwn
                            - plain_text
                          text:
                            type: string
                            maxLength: 200
                thread_ts:
                  type: string
                  maxLength: 24
                  x-mockingbird-resource-ref:
                    type: message
                    missing: '1000000000.000000'
                mrkdwn:
                  type: boolean
                unfurl_links:
                  type: boolean
              required:
              - channel
      responses:
        '200':
          description: 'Slack envelope: `ok: true` with the method''s fields, or `ok: false` with an `error`
            code (Slack answers logical failures with HTTP 200)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMessageResponse'
        '429':
          description: Rate limited (`ratelimited`), with `retry-after` seconds
          headers:
            retry-after:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Slack is having trouble
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Slack is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
