openapi: 3.1.0
info:
  title: Shopify Admin GraphQL API (Mockingbird subset)
  description: |
    Stateful emulator of the Shopify Admin GraphQL surface a fulfilment backend calls: orderCreate,
    draftOrderCreate + draftOrderComplete, order(id) with displayFulfillmentStatus and
    fulfillments { trackingInfo }, productVariants, metafieldsSet, webhookSubscriptionCreate,
    webhookSubscriptionDelete and webhookSubscriptions. GraphQL is one HTTP operation; documents
    are executed with the reference `graphql` implementation against a hand-authored subset of
    Shopify's schema (with Shopify's own type, field, enum and input names), so selection sets,
    aliases, variables and validation errors behave like the real API.
  version: "2026-10"
  x-mockingbird-upstream:
    note: >-
      Hand-authored from Shopify's Admin GraphQL reference (https://shopify.dev/docs/api/admin-graphql)
      and the surface named in crvouga/mockingbird#763.
servers:
  - url: https://mockingbird-test.myshopify.com
paths:
  /admin/api/{version}/graphql.json:
    post:
      operationId: AdminGraphql
      description: |
        One GraphQL document per request as JSON `{query, variables, operationName}`, with
        `X-Shopify-Access-Token`. A missing or unknown token answers 401. GraphQL errors (including
        `THROTTLED`) ride along with HTTP 200; every response carries `extensions.cost`.
      parameters:
        - name: version
          in: path
          required: true
          description: An Admin API version (`2026-10`) or `unstable`.
          schema:
            type: string
            enum: ["2026-01", "2026-04", "2026-07", "2026-10", unstable]
      security:
        - accessToken: []
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
          reason: Creates orders and webhook subscriptions in the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphqlRequest"
      responses:
        "200":
          description: A GraphQL response (errors, when any, ride along with HTTP 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphqlResponse"
        "400":
          description: The body is not a GraphQL request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestError"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestError"
components:
  securitySchemes:
    accessToken:
      type: apiKey
      in: header
      name: X-Shopify-Access-Token
  schemas:
    GraphqlRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: >-
            Any GraphQL document. The enum below is only what random parity walks send (a
            cross-section of a fulfilment backend's documents); the emulator executes any valid
            document.
          enum:
            - "query { shop { id name myshopifyDomain currencyCode } }"
            - "query Variants($query: String) { productVariants(first: 5, query: $query) { edges { cursor node { id sku price title product { id title } } } pageInfo { hasNextPage endCursor } } }"
            - "query Order($id: ID!) { order(id: $id) { id name displayFulfillmentStatus displayFinancialStatus cancelledAt totalPriceSet { shopMoney { amount currencyCode } } fulfillments(first: 5) { id status trackingInfo(first: 5) { company number url } } metafield(namespace: \"custom\", key: \"external_ref\") { value type } } }"
            - "mutation OrderCreate($variantId: ID, $email: String) { orderCreate(order: { email: $email, lineItems: [{ variantId: $variantId, quantity: 1 }] }) { order { id name displayFulfillmentStatus lineItems(first: 5) { nodes { sku quantity } } } userErrors { field message code } } }"
            - "mutation DraftOrderCreate($variantId: ID) { draftOrderCreate(input: { lineItems: [{ variantId: $variantId, quantity: 2 }] }) { draftOrder { id name status } userErrors { field message } } }"
            - "mutation DraftOrderComplete($id: ID!) { draftOrderComplete(id: $id) { draftOrder { id status order { id name displayFinancialStatus } } userErrors { field message } } }"
            - "mutation MetafieldsSet($ownerId: ID!, $value: String!) { metafieldsSet(metafields: [{ ownerId: $ownerId, namespace: \"custom\", key: \"external_ref\", type: \"single_line_text_field\", value: $value }]) { metafields { key namespace value type } userErrors { field message code elementIndex } } }"
            - "mutation WebhookCreate($callbackUrl: URL) { webhookSubscriptionCreate(topic: ORDERS_FULFILLED, webhookSubscription: { callbackUrl: $callbackUrl, format: JSON }) { webhookSubscription { id topic callbackUrl } userErrors { field message } } }"
            - "query Webhooks { webhookSubscriptions(first: 10) { nodes { id topic callbackUrl format } } }"
            - "query { notAField }"
        variables:
          type: object
          properties:
            id:
              type: string
              enum: ["gid://shopify/Order/5000000001", "gid://shopify/Order/5000000002", "gid://shopify/DraftOrder/900000001", "gid://shopify/Order/9"]
            variantId:
              type: string
              enum: ["gid://shopify/ProductVariant/41000000001", "gid://shopify/ProductVariant/41000000003", "gid://shopify/ProductVariant/1"]
            ownerId:
              type: string
              enum: ["gid://shopify/Order/5000000001", "gid://shopify/ProductVariant/41000000002", "gid://shopify/Order/1"]
            query:
              type: string
              enum: ["sku:MB-TEE-S", "mug", "product_id:7000000001"]
            email:
              type: string
              enum: ["buyer@example.test", "second.buyer@example.test"]
            value:
              type: string
              minLength: 1
              maxLength: 24
              pattern: "^[A-Za-z0-9_-]+$"
            callbackUrl:
              type: string
              enum: ["https://receiver.example.test/webhooks/shopify", "https://receiver.example.test/other", "not a url"]
        operationName:
          description: Optional; walks send none (every enumerated document has one operation).
          type: ["string", "null"]
          enum: [null]
    GraphqlError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        locations:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              column:
                type: integer
        path:
          type: array
          items:
            type: ["string", "integer"]
        extensions:
          type: object
    GraphqlResponse:
      type: object
      properties:
        data:
          type: ["object", "null"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/GraphqlError"
        extensions:
          type: object
          properties:
            cost:
              type: object
              required: [requestedQueryCost, actualQueryCost, throttleStatus]
              properties:
                requestedQueryCost:
                  type: number
                actualQueryCost:
                  type: ["number", "null"]
                throttleStatus:
                  type: object
                  required: [maximumAvailable, currentlyAvailable, restoreRate]
                  properties:
                    maximumAvailable:
                      type: number
                    currentlyAvailable:
                      type: number
                    restoreRate:
                      type: number
    RestError:
      type: object
      required: [errors]
      properties:
        errors:
          description: "A message, or an object of parameter name to message."
          type: ["string", "object"]
