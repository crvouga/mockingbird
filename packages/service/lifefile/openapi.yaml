{
  "openapi": "3.1.0",
  "info": {
    "title": "LifeFile order API (best-guess subset)",
    "version": "1",
    "description": "Hand-authored from public pharmacy integration source and consumer client. Best guess, not oracle-verified. Defaults and errors are best guesses, not oracle-verified. Set refusedShippingStates per pharmacy; no global state restriction. Set cancelStatus explicitly: unconfigured or other status changes return 501 without mutation. Data Push consumer object is provisional; vendor option uses public pharmacy demo array. See README.md for assumptions and evidence."
  },
  "servers": [
    {
      "url": "https://mock.lifefile.local"
    }
  ],
  "security": [
    {
      "basicAuth": []
    }
  ],
  "paths": {
    "/order": {
      "post": {
        "operationId": "CreateOrder",
        "x-mockingbird": {
          "supported": true,
          "parity": {
            "enabled": true,
            "safe": false
          }
        },
        "parameters": [
          {
            "name": "X-Vendor-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647
            }
          },
          {
            "name": "X-Location-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647
            }
          },
          {
            "name": "X-API-Network-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "message": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 2147483647
                      },
                      "sentTime": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "id"
                    ]
                  },
                  "order": {
                    "type": "object",
                    "properties": {
                      "general": {
                        "type": "object",
                        "properties": {
                          "referenceId": {
                            "type": "string"
                          }
                        }
                      },
                      "shipping": {
                        "type": "object",
                        "properties": {
                          "state": {
                            "type": "string",
                            "pattern": "^[A-Z]{2}$",
                            "examples": [
                              "AZ"
                            ]
                          }
                        },
                        "required": [
                          "state"
                        ]
                      },
                      "rxs": {
                        "type": "array",
                        "items": {
                          "type": "object"
                        },
                        "maxItems": 2
                      }
                    },
                    "required": [
                      "shipping"
                    ]
                  }
                },
                "required": [
                  "message",
                  "order"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success or business rejection; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "400": {
            "description": "Invalid body or integer headers; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "401": {
            "description": "Missing or wrong Basic credentials; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "404": {
            "description": "Unknown order; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "501": {
            "description": "Cancellation status unconfigured; emulator limitation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          }
        }
      }
    },
    "/order/{id}/status": {
      "put": {
        "operationId": "UpdateOrderStatus",
        "x-mockingbird": {
          "supported": true,
          "parity": {
            "enabled": true,
            "safe": false
          }
        },
        "parameters": [
          {
            "name": "X-Vendor-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647
            }
          },
          {
            "name": "X-Location-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647
            }
          },
          {
            "name": "X-API-Network-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 2147483647
            }
          },
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "x-mockingbird-resource-ref": {
                "type": "order",
                "missing": "missing"
              }
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "status": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "status"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success or business rejection; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "400": {
            "description": "Invalid body or integer headers; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "401": {
            "description": "Missing or wrong Basic credentials; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "404": {
            "description": "Unknown order; best guess",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "501": {
            "description": "Cancellation status unconfigured; emulator limitation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "basicAuth": {
        "type": "http",
        "scheme": "basic"
      }
    },
    "schemas": {
      "Envelope": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "success",
              "error"
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "orderId": {
                "type": "string",
                "x-mockingbird-resource": {
                  "type": "order",
                  "identity": true
                }
              }
            }
          }
        },
        "required": [
          "type",
          "message"
        ]
      }
    }
  }
}
