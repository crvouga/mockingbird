<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>sqlite-mem playground · Mockingbird</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='53' text-anchor='middle' font-size='54'%3E%F0%9F%90%A6%E2%80%8D%E2%AC%9B%3C/text%3E%3C/svg%3E"
    />
    <!-- Apply the visitor's stored light/dark choice (ThemeSwitch, `mb:theme`) before first paint. -->
    <script>
      try {
        var t = localStorage.getItem("mb:theme");
        if (t === "light" || t === "dark") {
          document.documentElement.classList.add(t);
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
