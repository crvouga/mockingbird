openapi: 3.1.0
info:
  title: Paddle Billing API (Mockingbird subset)
  description: |
    Stateful mock subset of the Paddle Billing API: customers with their addresses and
    businesses, the catalog (products and prices), transactions with computed totals,
    subscriptions with their lifecycle (activate, pause, resume, cancel, one-time charges,
    renewals) and the events list. Subscriptions come from paid transactions, as in Paddle:
    the mock's admin routes stand in for the hosted checkout and the billing engine.
  version: "1"
  x-mockingbird-upstream:
    note: >-
      Hand-authored from https://developer.paddle.com/api-reference/overview and the wire types
      of @paddle/paddle-node-sdk@3.10.0 (dist/types/**). Every entity carries the fields the SDK
      reads; enums are trimmed to representative values so generated requests stay meaningful.
servers:
  - url: https://sandbox-api.paddle.com
security:
  - bearerAuth: []
paths:
  /customers:
    get:
      operationId: ListCustomers
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          description: Comma-separated customer ids.
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: customer
              missing: ctm_00000000000000000000000000
        - name: email
          in: query
          description: Comma-separated exact email addresses.
          schema:
            type: string
            maxLength: 120
        - name: search
          in: query
          description: Matches id, name or email (case-insensitive substring).
          schema:
            type: string
            maxLength: 60
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Customers, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: CreateCustomer
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: The created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /customers/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: GetCustomer
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateCustomer
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: The updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /customers/{customer_id}/credit-balances:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: GetCustomerCreditBalances
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: One balance per currency the customer holds credit in (none, in the mock)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [customer_id, currency_code, balance]
                      properties:
                        customer_id:
                          type: string
                        currency_code:
                          $ref: "#/components/schemas/CurrencyCode"
                        balance:
                          type: object
                          required: [available, reserved, used]
                          properties:
                            available:
                              type: string
                            reserved:
                              type: string
                            used:
                              type: string
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customer_id}/auth-token:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: CreateCustomerAuthToken
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: A customer auth token for Paddle.js
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [customer_auth_token, expires_at]
                    properties:
                      customer_auth_token:
                        type: string
                        x-mockingbird-volatile:
                          kind: token
                      expires_at:
                        type: string
                        x-mockingbird-volatile:
                          kind: timestamp
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customer_id}/addresses:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: ListAddresses
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: address
              missing: add_00000000000000000000000000
        - name: search
          in: query
          schema:
            type: string
            maxLength: 60
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: The customer's addresses, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: CreateAddress
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreate"
      responses:
        "201":
          description: The created address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customer_id}/addresses/{address_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
      - $ref: "#/components/parameters/AddressId"
    get:
      operationId: GetAddress
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateAddress
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdate"
      responses:
        "200":
          description: The updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customer_id}/businesses:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: ListBusinesses
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: business
              missing: biz_00000000000000000000000000
        - name: search
          in: query
          schema:
            type: string
            maxLength: 60
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: The customer's businesses, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Business"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: CreateBusiness
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCreate"
      responses:
        "201":
          description: The created business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customer_id}/businesses/{business_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: GetBusiness
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateBusiness
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: The updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      operationId: ListProducts
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: product
              missing: pro_00000000000000000000000000
        - name: include
          in: query
          description: "`prices` embeds each product's prices."
          schema:
            type: string
            enum: [prices]
        - $ref: "#/components/parameters/StatusFilter"
        - name: tax_category
          in: query
          schema:
            $ref: "#/components/schemas/TaxCategory"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/CatalogType"
      responses:
        "200":
          description: Products, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: CreateProduct
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: The created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /products/{product_id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: GetProduct
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [prices]
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateProduct
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /prices:
    get:
      operationId: ListPrices
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: price
              missing: pri_00000000000000000000000000
        - name: product_id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: product
              missing: pro_00000000000000000000000000
        - name: include
          in: query
          description: "`product` embeds each price's product."
          schema:
            type: string
            enum: [product]
        - $ref: "#/components/parameters/StatusFilter"
        - name: recurring
          in: query
          schema:
            type: boolean
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/CatalogType"
      responses:
        "200":
          description: Prices, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Price"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: CreatePrice
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCreate"
      responses:
        "201":
          description: The created price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /prices/{price_id}:
    parameters:
      - $ref: "#/components/parameters/PriceId"
    get:
      operationId: GetPrice
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [product]
      responses:
        "200":
          description: The price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdatePrice
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceUpdate"
      responses:
        "200":
          description: The updated price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /transactions:
    get:
      operationId: ListTransactions
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: transaction
              missing: txn_00000000000000000000000000
        - name: customer_id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: customer
              missing: ctm_00000000000000000000000000
        - name: subscription_id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: subscription
              missing: sub_00000000000000000000000000
        - name: status
          in: query
          description: Comma-separated statuses.
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/TransactionOrigin"
        - name: collection_mode
          in: query
          schema:
            $ref: "#/components/schemas/CollectionMode"
        - name: invoice_number
          in: query
          schema:
            type: string
            maxLength: 40
        - name: include
          in: query
          description: Comma-separated relations to embed.
          schema:
            type: string
            enum: [customer, address, business, "customer,address", "customer,address,business"]
        - name: created_at[GTE]
          in: query
          description: Transactions created at or after this RFC 3339 datetime (`[LT]`, `[LTE]`, `[GT]` and `updated_at[…]` work the same way).
          schema:
            type: string
            pattern: "^20[2-3][0-9]-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?Z$"
        - name: billed_at[GTE]
          in: query
          schema:
            type: string
            pattern: "^20[2-3][0-9]-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?Z$"
      responses:
        "200":
          description: Transactions, newest first (30 per page)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: CreateTransaction
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      parameters:
        - $ref: "#/components/parameters/TransactionInclude"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: The created transaction, with computed totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /transactions/preview:
    post:
      operationId: PreviewTransaction
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPreviewRequest"
      responses:
        "200":
          description: Totals for the items, nothing stored
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/TransactionPreview"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /transactions/{transaction_id}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: GetTransaction
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/TransactionInclude"
      responses:
        "200":
          description: The transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateTransaction
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      parameters:
        - $ref: "#/components/parameters/TransactionInclude"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: The updated transaction (only `draft` and `ready` transactions can change)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /transactions/{transaction_id}/invoice:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: GetTransactionInvoice
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: disposition
          in: query
          schema:
            type: string
            enum: [attachment, inline]
      responses:
        "200":
          description: A link to the invoice PDF (billed, paid and completed transactions only)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        x-mockingbird-volatile:
                          kind: url
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /transactions/{transaction_id}/revise:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      operationId: ReviseTransaction
      x-mockingbird:
        supported: false
        reason: Invoice revision (customer, business and address corrections on billed transactions) is not modelled.
      responses:
        "200":
          description: The revised transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
  /subscriptions:
    get:
      operationId: ListSubscriptions
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
        - name: id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: subscription
              missing: sub_00000000000000000000000000
        - name: customer_id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: customer
              missing: ctm_00000000000000000000000000
        - name: address_id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: address
              missing: add_00000000000000000000000000
        - name: price_id
          in: query
          schema:
            type: string
            x-mockingbird-resource-ref:
              type: price
              missing: pri_00000000000000000000000000
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubscriptionStatus"
        - name: collection_mode
          in: query
          schema:
            $ref: "#/components/schemas/CollectionMode"
        - name: scheduled_change_action
          in: query
          schema:
            type: string
            enum: [cancel, pause, resume]
      responses:
        "200":
          description: Subscriptions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /subscriptions/{subscription_id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      operationId: GetSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: include
          in: query
          description: "`next_transaction` and `recurring_transaction_details` embed previews."
          schema:
            type: string
            enum: [next_transaction, recurring_transaction_details, "next_transaction,recurring_transaction_details"]
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: UpdateSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: The updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/{subscription_id}/preview:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    patch:
      operationId: PreviewSubscriptionUpdate
      x-mockingbird:
        supported: false
        reason: Update previews (proration credit/charge summaries) are not modelled; apply the update instead.
      responses:
        "200":
          description: A preview of the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /subscriptions/{subscription_id}/activate:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: ActivateSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      responses:
        "200":
          description: The subscription, now active (it must have been trialing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/{subscription_id}/pause:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: PauseSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effective_from:
                  type: ["string", "null"]
                  enum: [next_billing_period, immediately, null]
                resume_at:
                  type: ["string", "null"]
                  description: RFC 3339 datetime to resume at.
                  pattern: "^20[2-3][0-9]-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?Z$"
                on_resume:
                  type: string
                  enum: [continue_existing_billing_period, start_new_billing_period]
      responses:
        "200":
          description: The subscription, paused now or scheduled to pause
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/{subscription_id}/resume:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: ResumeSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effective_from]
              properties:
                effective_from:
                  type: string
                  description: "`immediately`, or an RFC 3339 datetime to resume at."
                  oneOf:
                    - type: string
                      enum: [immediately]
                    - type: string
                      pattern: "^20[2-3][0-9]-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?Z$"
                on_resume:
                  type: string
                  enum: [continue_existing_billing_period, start_new_billing_period]
      responses:
        "200":
          description: The subscription, active again or scheduled to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/{subscription_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: CancelSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effective_from:
                  type: ["string", "null"]
                  enum: [next_billing_period, immediately, null]
      responses:
        "200":
          description: The subscription, canceled now or scheduled to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/{subscription_id}/charge:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: CreateSubscriptionCharge
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effective_from, items]
              properties:
                effective_from:
                  type: string
                  enum: [next_billing_period, immediately]
                items:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    $ref: "#/components/schemas/TransactionItemRequest"
                on_payment_failure:
                  type: string
                  enum: [prevent_change, apply_change]
      responses:
        "200":
          description: The subscription; an immediate charge also creates a completed `subscription_charge` transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/{subscription_id}/charge/preview:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: PreviewSubscriptionCharge
      x-mockingbird:
        supported: false
        reason: One-time charge previews are not modelled; create the charge instead.
      responses:
        "200":
          description: A preview of the charge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /subscriptions/{subscription_id}/update-payment-method-transaction:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      operationId: GetSubscriptionPaymentMethodChangeTransaction
      x-mockingbird:
        supported: false
        reason: Payment method changes go through the hosted checkout, which the mock does not serve.
      responses:
        "200":
          description: A zero-amount transaction for updating the payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
  /events:
    get:
      operationId: ListEvents
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/OrderBy"
      responses:
        "200":
          description: Every event the account produced, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  meta:
                    $ref: "#/components/schemas/MetaPaginated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /notification-settings:
    get:
      operationId: ListNotificationSettings
      x-mockingbird:
        supported: false
        reason: Notification destinations are configured on the mock (`--webhook-url`, `PUT /__admin/webhook-endpoints`), not through the API.
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: CreateNotificationSetting
      x-mockingbird:
        supported: false
        reason: Notification destinations are configured on the mock (`--webhook-url`, `PUT /__admin/webhook-endpoints`), not through the API.
      responses:
        "201":
          description: The created notification setting
          content:
            application/json:
              schema:
                type: object
  /discounts:
    get:
      operationId: ListDiscounts
      x-mockingbird:
        supported: false
        reason: Discounts are not modelled; totals carry a zero discount.
      responses:
        "200":
          description: Discounts
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: CreateDiscount
      x-mockingbird:
        supported: false
        reason: Discounts are not modelled; totals carry a zero discount.
      responses:
        "201":
          description: The created discount
          content:
            application/json:
              schema:
                type: object
  /adjustments:
    get:
      operationId: ListAdjustments
      x-mockingbird:
        supported: false
        reason: Refunds and credits (adjustments) are not modelled.
      responses:
        "200":
          description: Adjustments
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: CreateAdjustment
      x-mockingbird:
        supported: false
        reason: Refunds and credits (adjustments) are not modelled.
      responses:
        "201":
          description: The created adjustment
          content:
            application/json:
              schema:
                type: object
  /customers/{customer_id}/portal-sessions:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: CreateCustomerPortalSession
      x-mockingbird:
        supported: false
        reason: The hosted customer portal is not served; `management_urls` on a subscription point at placeholder links.
      responses:
        "201":
          description: The created portal session
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer pdl_sdbx_apikey_…` (any key; none is 403 `authentication_missing`)"
  parameters:
    After:
      name: after
      in: query
      description: Return entities after this id (the cursor from `meta.pagination.next`).
      schema:
        type: string
        maxLength: 40
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    OrderBy:
      name: order_by
      in: query
      schema:
        type: string
        enum: ["id[ASC]", "id[DESC]"]
    StatusFilter:
      name: status
      in: query
      description: Comma-separated statuses.
      schema:
        type: string
        enum: [active, archived, "active,archived"]
    TransactionInclude:
      name: include
      in: query
      description: Comma-separated relations to embed.
      schema:
        type: string
        enum: [customer, address, business, "customer,address", "customer,address,business"]
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: customer
          missing: ctm_00000000000000000000000000
    AddressId:
      name: address_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: address
          missing: add_00000000000000000000000000
    BusinessId:
      name: business_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: business
          missing: biz_00000000000000000000000000
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: product
          missing: pro_00000000000000000000000000
    PriceId:
      name: price_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: price
          missing: pri_00000000000000000000000000
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: transaction
          missing: txn_00000000000000000000000000
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: subscription
          missing: sub_00000000000000000000000000
  responses:
    BadRequest:
      description: Validation failed (`invalid_field`, with `errors[]`) or the request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing, malformed or rejected API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No such entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The change conflicts with existing state (a customer with that email exists)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RequestId:
      type: string
      x-mockingbird-volatile:
        kind: opaque
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
    MetaPaginated:
      type: object
      required: [request_id, pagination]
      properties:
        request_id:
          $ref: "#/components/schemas/RequestId"
        pagination:
          type: object
          required: [per_page, next, has_more, estimated_total]
          properties:
            per_page:
              type: integer
            next:
              type: string
              x-mockingbird-volatile:
                kind: url
            has_more:
              type: boolean
            estimated_total:
              type: integer
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [type, code, detail, documentation_url]
          properties:
            type:
              type: string
              enum: [request_error, api_error]
            code:
              type: string
            detail:
              type: string
            documentation_url:
              type: string
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: "#/components/schemas/Meta"
    Timestamp:
      type: string
      x-mockingbird-volatile:
        kind: timestamp
    NullableTimestamp:
      type: ["string", "null"]
      x-mockingbird-volatile:
        kind: timestamp
    Status:
      type: string
      enum: [active, archived]
    CatalogType:
      type: string
      enum: [standard, custom]
    CurrencyCode:
      type: string
      enum: [USD, EUR, GBP, CAD, AUD, JPY]
    CountryCode:
      type: string
      enum: [US, GB, DE, FR, CA, AU, NL, ES, IE, JP]
    TaxCategory:
      type: string
      enum: [standard, saas, digital-goods, ebooks, implementation-services, professional-services, software-programming-services, training-services, website-hosting]
    TaxMode:
      type: string
      enum: [account_setting, external, internal, location]
    Interval:
      type: string
      enum: [day, week, month, year]
    CollectionMode:
      type: string
      enum: [automatic, manual]
    TransactionStatus:
      type: string
      enum: [draft, ready, billed, paid, completed, canceled, past_due]
    TransactionOrigin:
      type: string
      enum: [api, subscription_charge, subscription_payment_method_change, subscription_recurring, subscription_update, web]
    SubscriptionStatus:
      type: string
      enum: [active, canceled, past_due, paused, trialing]
    CustomData:
      type: ["object", "null"]
      description: Your own key-value data, echoed back unchanged.
      maxProperties: 10
      additionalProperties:
        type: ["string", "number", "boolean", "null"]
    ImportMeta:
      type: ["object", "null"]
      required: [imported_from]
      properties:
        external_id:
          type: ["string", "null"]
        imported_from:
          type: string
    Email:
      type: string
      description: An email address.
      pattern: "^[A-Za-z0-9._+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)+$"
      maxLength: 120
    Locale:
      type: string
      pattern: "^[a-z]{2}(-[A-Z]{2})?$"
    Money:
      type: object
      required: [amount, currency_code]
      properties:
        amount:
          type: string
          description: In the currency's lowest unit, as a string of digits.
          pattern: "^[0-9]{1,9}$"
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
    TimePeriod:
      type: object
      required: [interval, frequency]
      properties:
        interval:
          $ref: "#/components/schemas/Interval"
        frequency:
          type: integer
          minimum: 1
          maximum: 365
    TrialPeriod:
      type: object
      required: [interval, frequency]
      properties:
        interval:
          $ref: "#/components/schemas/Interval"
        frequency:
          type: integer
          minimum: 1
          maximum: 365
        requires_payment_method:
          type: boolean
    PriceQuantity:
      type: object
      required: [minimum, maximum]
      properties:
        minimum:
          type: integer
          minimum: 1
          maximum: 999
        maximum:
          type: integer
          minimum: 1
          maximum: 999
    UnitPriceOverride:
      type: object
      required: [country_codes, unit_price]
      properties:
        country_codes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/CountryCode"
        unit_price:
          $ref: "#/components/schemas/Money"
    Customer:
      type: object
      required: [id, name, email, marketing_consent, status, custom_data, locale, created_at, updated_at, import_meta]
      properties:
        id:
          type: string
          x-mockingbird-resource:
            type: customer
            identity: true
          x-mockingbird-volatile:
            kind: id
        name:
          type: ["string", "null"]
        email:
          type: string
        marketing_consent:
          type: boolean
        status:
          $ref: "#/components/schemas/Status"
        custom_data:
          $ref: "#/components/schemas/CustomData"
        locale:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        import_meta:
          $ref: "#/components/schemas/ImportMeta"
    CustomerResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Customer"
        meta:
          $ref: "#/components/schemas/Meta"
    CustomerCreate:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: ["string", "null"]
          maxLength: 80
        custom_data:
          $ref: "#/components/schemas/CustomData"
        locale:
          $ref: "#/components/schemas/Locale"
    CustomerUpdate:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: ["string", "null"]
          maxLength: 80
        status:
          $ref: "#/components/schemas/Status"
        custom_data:
          $ref: "#/components/schemas/CustomData"
        locale:
          $ref: "#/components/schemas/Locale"
    Address:
      type: object
      required: [id, customer_id, description, first_line, second_line, city, postal_code, region, country_code, custom_data, status, created_at, updated_at, import_meta]
      properties:
        id:
          type: string
          x-mockingbird-resource:
            type: address
            identity: true
          x-mockingbird-volatile:
            kind: id
        customer_id:
          type: string
          x-mockingbird-volatile:
            kind: id
        description:
          type: ["string", "null"]
        first_line:
          type: ["string", "null"]
        second_line:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postal_code:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        country_code:
          type: string
        custom_data:
          $ref: "#/components/schemas/CustomData"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        import_meta:
          $ref: "#/components/schemas/ImportMeta"
    AddressResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Address"
        meta:
          $ref: "#/components/schemas/Meta"
    AddressFields:
      type: object
