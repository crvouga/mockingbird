    SubscriptionItem:
      type: object
      required: [status, quantity, recurring, created_at, updated_at, previously_billed_at, next_billed_at, trial_dates, price, product]
      properties:
        status:
          type: string
          enum: [active, inactive, trialing]
        quantity:
          type: integer
        recurring:
          type: boolean
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        previously_billed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        next_billed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        trial_dates:
          oneOf:
            - $ref: "#/components/schemas/BillingPeriod"
            - type: "null"
        price:
          $ref: "#/components/schemas/Price"
        product:
          $ref: "#/components/schemas/Product"
    ScheduledChange:
      type: ["object", "null"]
      required: [action, effective_at, resume_at]
      properties:
        action:
          type: string
          enum: [cancel, pause, resume]
        effective_at:
          $ref: "#/components/schemas/Timestamp"
        resume_at:
          $ref: "#/components/schemas/NullableTimestamp"
    Subscription:
      type: object
      required: [id, status, customer_id, address_id, business_id, currency_code, created_at, updated_at, started_at, first_billed_at, next_billed_at, paused_at, canceled_at, discount, collection_mode, billing_details, current_billing_period, billing_cycle, scheduled_change, management_urls, items, custom_data, import_meta]
      properties:
        id:
          type: string
          x-mockingbird-resource:
            type: subscription
            identity: true
          x-mockingbird-volatile:
            kind: id
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        customer_id:
          type: string
          x-mockingbird-volatile:
            kind: id
        address_id:
          type: string
          x-mockingbird-volatile:
            kind: id
        business_id:
          type: ["string", "null"]
          x-mockingbird-volatile:
            kind: id
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          $ref: "#/components/schemas/NullableTimestamp"
        first_billed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        next_billed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        paused_at:
          $ref: "#/components/schemas/NullableTimestamp"
        canceled_at:
          $ref: "#/components/schemas/NullableTimestamp"
        discount:
          type: "null"
        collection_mode:
          $ref: "#/components/schemas/CollectionMode"
        billing_details:
          $ref: "#/components/schemas/BillingDetailsResponse"
        current_billing_period:
          oneOf:
            - $ref: "#/components/schemas/BillingPeriod"
            - type: "null"
        billing_cycle:
          $ref: "#/components/schemas/TimePeriod"
        scheduled_change:
          $ref: "#/components/schemas/ScheduledChange"
        management_urls:
          type: object
          required: [update_payment_method, cancel]
          properties:
            update_payment_method:
              type: ["string", "null"]
              x-mockingbird-volatile:
                kind: url
            cancel:
              type: string
              x-mockingbird-volatile:
                kind: url
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionItem"
        custom_data:
          $ref: "#/components/schemas/CustomData"
        import_meta:
          $ref: "#/components/schemas/ImportMeta"
        next_transaction:
          description: Present with `include=next_transaction` (null once canceled).
          type: ["object", "null"]
          required: [billing_period, details, adjustments]
          properties:
            billing_period:
              $ref: "#/components/schemas/BillingPeriod"
            details:
              $ref: "#/components/schemas/PreviewDetails"
            adjustments:
              type: array
              items:
                type: object
        recurring_transaction_details:
          description: Present with `include=recurring_transaction_details`.
          $ref: "#/components/schemas/PreviewDetails"
    PreviewDetails:
      type: object
      required: [tax_rates_used, totals, line_items]
      properties:
        tax_rates_used:
          type: array
          items:
            $ref: "#/components/schemas/TaxRateUsed"
        totals:
          $ref: "#/components/schemas/TransactionTotals"
        line_items:
          type: array
          items:
            type: object
            required: [price_id, quantity, tax_rate, unit_totals, totals, product, proration]
            properties:
              price_id:
                type: string
                x-mockingbird-volatile:
                  kind: id
              quantity:
                type: integer
              tax_rate:
                type: string
              unit_totals:
                $ref: "#/components/schemas/Totals"
              totals:
                $ref: "#/components/schemas/Totals"
              product:
                $ref: "#/components/schemas/Product"
              proration:
                type: "null"
    SubscriptionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Subscription"
        meta:
          $ref: "#/components/schemas/Meta"
    SubscriptionUpdate:
      type: object
      properties:
        customer_id:
          type: string
          x-mockingbird-resource-ref:
            type: customer
            missing: ctm_00000000000000000000000000
        address_id:
          type: string
          x-mockingbird-resource-ref:
            type: address
            missing: add_00000000000000000000000000
        business_id:
          type: ["string", "null"]
          x-mockingbird-resource-ref:
            type: business
            missing: biz_00000000000000000000000000
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
        next_billed_at:
          type: string
          pattern: "^20[2-3][0-9]-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?Z$"
        collection_mode:
          $ref: "#/components/schemas/CollectionMode"
        billing_details:
          oneOf:
            - $ref: "#/components/schemas/BillingDetails"
            - type: "null"
        scheduled_change:
          type: "null"
          description: Only `null` is accepted, to remove a scheduled change.
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/TransactionItemRequest"
        custom_data:
          $ref: "#/components/schemas/CustomData"
        proration_billing_mode:
          type: string
          enum: [prorated_immediately, prorated_next_billing_period, full_immediately, full_next_billing_period, do_not_bill]
        on_payment_failure:
          type: string
          enum: [prevent_change, apply_change]
    Event:
      type: object
      required: [event_id, event_type, occurred_at, notification_id, data]
      properties:
        event_id:
          type: string
          x-mockingbird-volatile:
            kind: id
        event_type:
          type: string
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        notification_id:
          type: "null"
        data:
          type: object
