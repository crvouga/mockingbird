openapi: 3.1.0
info:
  title: Docker Engine (Mockingbird)
  version: "1.52"
  description: Docker Engine 29.1.0 / API 1.52 observation subset. Unversioned and
    /v1.52 aliases; unsupported older mock versions return 501. Container
    creation is supported; start and wait use explicit simulated completion;
    stop, kill and removal use explicit termination controls. Attach is unavailable
    through Fetch; the Node server supports scripted non-TTY duplex streams.
    Synthetic metadata is not host attestation. See
    API_EVIDENCE.md.
  x-mockingbird-upstream:
    url: https://github.com/moby/moby/blob/710302ecf2e958db92cb7d92f8838ea063a31765/api/swagger.yaml
    note: Selected operation inventory adapted from Engine 29.1.0/API 1.52.
      Unsupported operations have no successful implementation.
servers:
  - url: http://127.0.0.1
paths:
  /containers/json:
    get:
      operationId: ContainerList
      summary: List containers
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: no error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: string
                    Names:
                      type: array
                      items:
                        type: string
                    Image:
                      type: string
                    ImageID:
                      type: string
                    Command:
                      type: string
                    Created:
                      type: integer
                    State:
                      type: string
                    Status:
                      type: string
                    Labels:
                      type: object
                      additionalProperties:
                        type: string
                    Ports:
                      type: array
                      items:
                        type: object
                    HostConfig:
                      type: object
                    NetworkSettings:
                      type: object
                    Mounts:
                      type: array
                      items:
                        type: object
                  required:
                    - Id
                    - Names
                    - Image
                    - ImageID
                    - Command
                    - Created
                    - State
                    - Status
                    - Labels
                    - Ports
                    - HostConfig
                    - NetworkSettings
                    - Mounts
        "400":
          description: Invalid query or ambiguous container ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported API version or filter feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: all
          in: query
          description: >
            Return all containers. By default, only running containers are shown.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: |
            Return this number of most recently created containers, including
            non-running ones.
          schema:
            type: integer
        - name: size
          in: query
          description: |
            Return the size of container as fields `SizeRw` and `SizeRootFs`.
          schema:
            type: boolean
            default: false
        - name: filters
          in: query
          description: |
            Filters to process on the container list, encoded as JSON (a
            `map[string][]string`). For example, `{"status": ["paused"]}` will
            only return paused containers.

            Available filters:

            - `ancestor`=(`<image-name>[:<tag>]`, `<image id>`, or `<image@digest>`)
            - `before`=(`<container id>` or `<container name>`)
            - `expose`=(`<port>[/<proto>]`|`<startport-endport>/[<proto>]`)
            - `exited=<int>` containers with exit code of `<int>`
            - `health`=(`starting`|`healthy`|`unhealthy`|`none`)
            - `id=<ID>` a container's ID
            - `isolation=`(`default`|`process`|`hyperv`) (Windows daemon only)
            - `is-task=`(`true`|`false`)
            - `label=key` or `label="key=value"` of a container label
            - `name=<name>` a container's name
            - `network`=(`<network id>` or `<network name>`)
            - `publish`=(`<port>[/<proto>]`|`<startport-endport>/[<proto>]`)
            - `since`=(`<container id>` or `<container name>`)
            - `status=`(`created`|`restarting`|`running`|`removing`|`paused`|`exited`|`dead`)
            - `volume`=(`<volume name>` or `<mount point destination>`)
          schema:
            type: string
  /containers/create:
    post:
      operationId: ContainerCreate
      summary: Create a container
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      responses:
        "201":
          description: Container created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - Id
                  - Warnings
                properties:
                  Id:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                    x-mockingbird-resource:
                      type: container
                      identity: true
                  Warnings:
                    type: array
                    items:
                      type: string
        "400":
          description: bad parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported creation configuration or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Image:
                  type:
                    - string
                    - "null"
                WorkingDir:
                  type:
                    - string
                    - "null"
                User:
                  type:
                    - string
                    - "null"
                StopSignal:
                  type:
                    - string
                    - "null"
                Hostname:
                  type:
                    - string
                    - "null"
                Domainname:
                  type:
                    - string
                    - "null"
                Cmd:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                Entrypoint:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                Env:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                AttachStdin:
                  type:
                    - boolean
                    - "null"
                AttachStdout:
                  type:
                    - boolean
                    - "null"
                AttachStderr:
                  type:
                    - boolean
                    - "null"
                OpenStdin:
                  type:
                    - boolean
                    - "null"
                StdinOnce:
                  type:
                    - boolean
                    - "null"
                Tty:
                  type:
                    - boolean
                    - "null"
                NetworkDisabled:
                  type:
                    - boolean
                    - "null"
                Labels:
                  type:
                    - object
                    - "null"
                  additionalProperties:
                    type: string
                StopTimeout:
                  type:
                    - integer
                    - "null"
                  minimum: -1
                HostConfig:
                  type:
                    - object
                    - "null"
                NetworkingConfig:
                  type:
                    - object
                    - "null"
                  properties:
                    EndpointsConfig:
                      type:
                        - object
                        - "null"
                      additionalProperties:
                        type: object
              required:
                - Image
              description: Selected creation metadata. Unsupported configuration fields return
                Mockingbird 501; stored HostConfig/NetworkingConfig is never
                enforced.
      parameters:
        - name: name
          in: query
          schema:
            type: string
            pattern: ^/?[a-zA-Z0-9][a-zA-Z0-9_.-]+$
        - name: platform
          in: query
          schema:
            type: string
  /containers/{id}/json:
    get:
      operationId: ContainerInspect
      summary: Inspect a container
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: id
          in: path
          required: true
          description: ID or name of the container
          schema:
            type: string
        - name: size
          in: query
          description: Return the size of container as fields `SizeRw` and `SizeRootFs`
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: no error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Id:
                    type: string
                  Name:
                    type: string
                  Image:
                    type: string
                  Created:
                    type: string
                  Path:
                    type: string
                  Args:
                    type: array
                    items:
                      type: string
                  State:
                    type: object
                    properties:
                      Status:
                        type: string
                        enum:
                          - created
                          - running
                          - paused
                          - restarting
                          - removing
                          - exited
                          - dead
                      Running:
                        type: boolean
                      Paused:
                        type: boolean
                      Restarting:
                        type: boolean
                      OOMKilled:
                        type: boolean
                      Dead:
                        type: boolean
                      Pid:
                        type: integer
                      ExitCode:
                        type: integer
                      Error:
                        type: string
                      StartedAt:
                        type: string
                      FinishedAt:
                        type: string
                    required:
                      - Status
                      - Running
                      - Paused
                      - Restarting
                      - OOMKilled
                      - Dead
                      - Pid
                      - ExitCode
                      - Error
                      - StartedAt
                      - FinishedAt
                  Config:
                    type: object
                    properties:
                      Image:
                        type: string
                      Labels:
                        type: object
                        additionalProperties:
                          type: string
                      Cmd:
                        type: array
                        items:
                          type: string
                      Entrypoint:
                        type: array
                        items:
                          type: string
                      Env:
                        type: array
                        items:
                          type: string
                      WorkingDir:
                        type: string
                      User:
                        type: string
                      Tty:
                        type: boolean
                      OpenStdin:
                        type: boolean
                      StdinOnce:
                        type: boolean
                      AttachStdin:
                        type: boolean
                      AttachStdout:
                        type: boolean
                      AttachStderr:
                        type: boolean
                    required:
                      - Image
                      - Labels
                      - Cmd
                      - Entrypoint
                      - Env
                      - WorkingDir
                      - User
                      - Tty
                      - OpenStdin
                      - StdinOnce
                      - AttachStdin
                      - AttachStdout
                      - AttachStderr
                  HostConfig:
                    type: object
                  NetworkSettings:
                    type: object
                  Mounts:
                    type: array
                    items:
                      type: object
                required:
                  - Id
                  - Name
                  - Image
                  - Created
                  - Path
                  - Args
                  - State
                  - Config
                  - HostConfig
                  - NetworkSettings
                  - Mounts
        "400":
          description: Invalid query or ambiguous container ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported API version or filter feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /containers/{id}/start:
    post:
      operationId: ContainerStart
      summary: Start a container
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no error
        "304":
          description: container already started
        "400":
          description: invalid request or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: paused, dead, or removing container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported option or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /containers/{id}/stop:
    post:
      operationId: ContainerStop
      summary: Stop a container
      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: false
          reason: Explicit completion controls and pending responses require deterministic
            termination tests, not unbounded generated walks.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: signal
          schema:
            type: string
        - in: query
          name: t
          schema:
            type: integer
      responses:
        "204":
          description: no error
        "304":
          description: container already stopped
        "400":
          description: Version rejected by Engine (below 1.24 uses plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported option or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /containers/{id}/kill:
    post:
      operationId: ContainerKill
      summary: Kill a container
      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: false
          reason: Explicit completion controls and pending responses require deterministic
            termination tests, not unbounded generated walks.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: signal
          schema:
            type: string
      responses:
        "204":
          description: no error
        "400":
          description: Version rejected by Engine (below 1.24 uses plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: container is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported option or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /containers/{id}/attach:
    post:
      operationId: ContainerAttach
      summary: Attach to a container
      x-mockingbird:
        supported: false
        reason: Unsupported through Fetch. The Node server supports non-TTY streaming
          attach, verified by raw-wire tests and selected real Engine comparisons.
        parity:
          enabled: false
          reason: Raw duplex HTTP upgrade cannot be represented by a Fetch response.
          safe: false
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "101":
          description: no error, hints proxy about hijacking
        "200":
          description: no error, no upgrade header found
        "400":
          description: bad parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Mockingbird Fetch transport: duplex attach is unsupported"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /containers/{id}/wait:
    post:
      operationId: ContainerWait
      summary: Wait for a container
      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: false
          reason: Requires deterministic completion and cancellation; verified by
            lifecycle tests instead of unbounded generated waits.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: condition
          schema:
            type: string
            enum:
              - ""
              - not-running
              - next-exit
              - removed
            default: not-running
      responses:
        "200":
          description: Headers arrive immediately; the JSON body arrives when the wait
            condition is met.
          content:
            application/json:
              schema:
                type: object
                required:
                  - StatusCode
                properties:
                  StatusCode:
                    type: integer
                  Error:
                    type: object
                    properties:
                      Message:
                        type: string
        "400":
          description: bad parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported option or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /containers/{id}:
    delete:
      operationId: ContainerDelete
      summary: Remove a container
      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: false
          reason: Explicit completion controls and pending responses require deterministic
            termination tests, not unbounded generated walks.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: force
          schema:
            type: boolean
            default: false
        - in: query
          name: v
          schema:
            type: boolean
            default: false
        - in: query
          name: link
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: no error
        "400":
          description: bad parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported option or API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /info:
    get:
      operationId: SystemInfo
      summary: Get system information
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ID:
                    type: string
                  Name:
                    type: string
                  ServerVersion:
                    type: string
                  Containers:
                    type: integer
                  ContainersRunning:
                    type: integer
                  ContainersPaused:
                    type: integer
                  ContainersStopped:
                    type: integer
                  Images:
                    type: integer
                  Driver:
                    type: string
                  OSType:
                    type: string
                  Architecture:
                    type: string
                  OperatingSystem:
                    type: string
                  KernelVersion:
                    type: string
                  DockerRootDir:
                    type: string
                  SecurityOptions:
                    type: array
                    items:
                      type: string
                  SystemTime:
                    type: string
                    x-mockingbird-volatile:
                      kind: timestamp
                  NCPU:
                    type: integer
                  MemTotal:
                    type: integer
                  Labels:
                    type: array
                    items:
                      type: string
                  Warnings:
                    type: array
                    items:
                      type: string
                required:
                  - ID
                  - Name
                  - ServerVersion
                  - Containers
                  - ContainersRunning
                  - ContainersPaused
                  - ContainersStopped
                  - Images
                  - Driver
                  - OSType
                  - Architecture
                  - OperatingSystem
                  - KernelVersion
                  - DockerRootDir
                  - SecurityOptions
                  - SystemTime
                  - NCPU
                  - MemTotal
                  - Labels
                  - Warnings
        "400":
          description: Version rejected by Engine (below 1.24 uses plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported API version or filter feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters: []
  /version:
    get:
      operationId: SystemVersion
      summary: Get version
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: no error
          content:
            application/json:
              schema:
                type: object
                properties:
                  Version:
                    type: string
                  ApiVersion:
                    type: string
                  MinAPIVersion:
                    type: string
                  GitCommit:
                    type: string
                  GoVersion:
                    type: string
                  Os:
                    type: string
                  Arch:
                    type: string
                  KernelVersion:
                    type: string
                  BuildTime:
                    type: string
                  Experimental:
                    type: boolean
                  Platform:
                    type: object
                    properties:
                      Name:
                        type: string
                    required:
                      - Name
                  Components:
                    type: array
                    items:
                      type: object
                      properties:
                        Name:
                          type: string
                        Version:
                          type: string
                        Details:
                          type: object
                      required:
                        - Name
                        - Version
                        - Details
                required:
                  - Version
                  - ApiVersion
                  - MinAPIVersion
                  - GitCommit
                  - GoVersion
                  - Os
                  - Arch
                  - KernelVersion
                  - BuildTime
                  - Experimental
                  - Platform
                  - Components
        "400":
          description: Version rejected by Engine (below 1.24 uses plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported API version or filter feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters: []
  /_ping:
    get:
      operationId: SystemPing
      summary: Ping
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: no error
          headers:
            API-Version:
              schema:
                type: string
                const: "1.52"
            Docker-Experimental:
              schema:
                type: string
                const: "false"
            Builder-Version:
              schema:
                type: string
                const: "2"
            Swarm:
              schema:
                type: string
                const: inactive
            Cache-Control:
              schema:
                type: string
            Pragma:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                const: OK
        "400":
          description: Version rejected by Engine (below 1.24 uses plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      operationId: SystemPingHead
      summary: Ping
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: no error
          headers:
            API-Version:
              schema:
                type: string
                const: "1.52"
            Docker-Experimental:
              schema:
                type: string
                const: "false"
            Builder-Version:
              schema:
                type: string
                const: "2"
            Swarm:
              schema:
                type: string
                const: inactive
            Cache-Control:
              schema:
                type: string
            Pragma:
              schema:
                type: string
        "400":
          description: Version rejected by Engine (below 1.24 uses plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "500":
          description: server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Mockingbird unsupported API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
