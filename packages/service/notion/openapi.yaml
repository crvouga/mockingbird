openapi: 3.1.0
info:
  title: Notion database subset
  version: '2022-06-28'
  x-mockingbird-upstream:
    url: https://github.com/makenotion/notion-sdk-js/tree/v2.2.15
servers:
  - url: https://api.notion.com
paths:
  /v1/oauth/token:
    post:
      operationId: OAuthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, code]
              properties:
                grant_type: { type: string, enum: [authorization_code] }
                code: { type: string, maxLength: 100 }
                redirect_uri: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Workspace token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, bot_id, workspace_id]
                properties:
                  access_token: { type: string }
                  token_type: { const: bearer }
                  bot_id: { type: string }
                  workspace_id: { type: string }
        '400': { $ref: '#/components/responses/OAuthError' }
        '401': { $ref: '#/components/responses/OAuthError' }
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
  /v1/search:
    post:
      operationId: Search
      requestBody:
        required: true
        content:
          application/json:
            example: { filter: { property: object, value: database }, page_size: 100 }
            schema:
              type: object
              properties:
                query: { type: string, maxLength: 100 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
                start_cursor: { type: string, maxLength: 100 }
                filter:
                  type: object
                  required: [property, value]
                  properties:
                    property: { const: object }
                    value: { type: string, enum: [database, page] }
      responses:
        '200':
          description: Legacy database/page search
          content:
            application/json:
              schema:
                type: object
                required: [object, type, page_or_database, results, next_cursor, has_more]
                properties:
                  object: { const: list }
                  type: { const: page_or_database }
                  page_or_database: { type: object }
                  results: { type: array, items: { type: object } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
  /v1/pages:
    post:
      operationId: CreatePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent, properties]
              properties:
                parent:
                  type: object
                  required: [database_id]
                  properties: { database_id: { type: string, maxLength: 100 } }
                properties: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Created page
          content:
            application/json:
              schema:
                type: object
                required: [object, id, parent, properties]
                properties:
                  object: { const: page }
                  id:
                    type: string
                    x-mockingbird-resource: { type: page, identity: true }
                  parent: { type: object }
                  properties: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
  /v1/blocks/{block_id}/children:
    parameters:
      - name: block_id
        in: path
        required: true
        description: A page id (a page is also a block) or a block id, hyphenated or 32 hex digits.
        schema:
          type: string
          x-mockingbird-resource-ref:
            type: page
            missing: 00000000-0000-4000-8000-00000000dead
    get:
      operationId: GetBlockChildren
      description: Children of a page or block, in order, paged with start_cursor / next_cursor.
      parameters:
        - { name: start_cursor, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: A list of blocks
          content:
            application/json:
              schema:
                type: object
                required: [object, type, block, results, next_cursor, has_more]
                properties:
                  object: { const: list }
                  type: { const: block }
                  block: { type: object }
                  results: { type: array, items: { type: object } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
components:
  responses:
    Error:
      description: Notion error envelope
      content:
        application/json:
          schema:
            type: object
            required: [object, status, code, message]
            properties:
              object: { const: error }
              status: { type: integer }
              code: { type: string }
              message: { type: string }
    OAuthError:
      description: OAuth error
      content:
        application/json:
          schema: { type: object, required: [error], properties: { error: { type: string } } }
