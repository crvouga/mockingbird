components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-vital-api-key
  schemas:
    UserCreateBody:
      type: object
      required: [client_user_id]
      properties:
        client_user_id:
          type: string
          minLength: 1
          maxLength: 64
          examples: [mbr_8891, patient-1042, user.profile_52]
        fallback_time_zone:
          type: ["string", "null"]
          enum: [America/Los_Angeles, America/New_York, Europe/London, UTC, null]
    ClientFacingUser:
      type: object
      required:
        - user_id
        - team_id
        - client_user_id
        - created_on
        - connected_sources
        - fallback_time_zone
      properties:
        user_id:
          type: string
          format: uuid
          x-mockingbird-resource:
            type: user
            identity: true
          x-mockingbird-volatile:
            kind: id
        team_id:
          type: string
          format: uuid
          x-mockingbird-volatile:
            kind: account
        client_user_id:
          type: string
        created_on:
          type: string
          format: date-time
          x-mockingbird-volatile:
            kind: timestamp
        connected_sources:
          type: array
          items:
            type: object
            additionalProperties: true
        fallback_time_zone:
          type: ["object", "null"]
          properties:
            id:
              type: string
            source_slug:
              type: string
            updated_at:
              type: string
              format: date-time
              x-mockingbird-volatile:
                kind: timestamp
        fallback_birth_date:
          type: ["object", "null"]
          properties:
            value:
              type: string
            source_slug:
              type: string
            updated_at:
              type: string
              format: date-time
              x-mockingbird-volatile:
                kind: timestamp
        ingestion_start:
          type: ["string", "null"]
        ingestion_end:
          type: ["string", "null"]
    UserInfoPatchBody:
      type: object
      properties:
        first_name:
          type: [string, "null"]
        last_name:
          type: [string, "null"]
        dob:
          type: [string, "null"]
        gender:
          type: [string, "null"]
        phone_number:
          type: [string, "null"]
        email:
          type: [string, "null"]
        address:
          type: [object, "null"]
          additionalProperties: true
    UserInfo:
      type: object
      additionalProperties: true
    ClientUserIDConflictResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_type, error_message, user_id, created_on]
          properties:
            error_type:
              type: string
            error_message:
              type: string
            user_id:
              type: string
              format: uuid
              x-mockingbird-volatile:
                kind: id
            created_on:
              type: string
              format: date-time
              x-mockingbird-volatile:
                kind: timestamp
    UserSuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    PaginatedUsersResponse:
      type: object
      required: [users, total, offset, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ClientFacingUser"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    UserPatchBody:
      type: object
      properties:
        fallback_time_zone:
          type: ["string", "null"]
        fallback_birth_date:
          type: ["string", "null"]
          format: date
        ingestion_start:
          type: ["string", "null"]
          format: date
        ingestion_end:
          type: ["string", "null"]
          format: date
        client_user_id:
          type: ["string", "null"]
    LabTestCollectionMethod:
      type: string
      enum: [testkit, walk_in_test, at_home_phlebotomy, on_site_collection]
    LabTestSampleType:
      type: string
      enum: [dried_blood_spot, arm_collector, serum, saliva, urine, stool]
    LabTestStatus:
      type: string
      enum: [active, pending_approval, inactive]
    MarkerType:
      type: string
      enum: [biomarker, panel]
    ClientFacingLab:
      type: object
      required:
        - id
        - slug
        - name
        - first_line_address
        - city
        - zipcode
        - collection_methods
        - sample_types
      properties:
        id:
          type: integer
          x-mockingbird-volatile:
            kind: id
        slug:
          type: string
        name:
          type: string
        first_line_address:
          type: string
        city:
          type: string
        zipcode:
          type: string
        collection_methods:
          type: array
          items:
            $ref: "#/components/schemas/LabTestCollectionMethod"
        sample_types:
          type: array
          items:
            $ref: "#/components/schemas/LabTestSampleType"
        logo_url:
          type: ["string", "null"]
    ClientFacingMarker:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          x-mockingbird-volatile:
            kind: id
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        lab_id:
          type: ["integer", "null"]
        provider_id:
          type: ["string", "null"]
        type:
          anyOf:
            - $ref: "#/components/schemas/MarkerType"
            - type: "null"
        unit:
          type: ["string", "null"]
        price:
          type: ["string", "null"]
        aoe:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        a_la_carte_enabled:
          type: boolean
          default: false
        common_tat_days:
          type: ["integer", "null"]
        worst_case_tat_days:
          type: ["integer", "null"]
        is_orderable:
          type: ["boolean", "null"]
          default: true
    ClientFacingLabTest:
      type: object
      required:
        - id
        - slug
        - name
        - sample_type
        - method
        - price
        - is_active
        - status
        - lab
        - markers
      properties:
        id:
          type: string
          format: uuid
          x-mockingbird-resource:
            type: lab_test
            identity: true
        slug:
          type: string
        name:
          type: string
        sample_type:
          $ref: "#/components/schemas/LabTestSampleType"
        method:
          $ref: "#/components/schemas/LabTestCollectionMethod"
        price:
          type: number
        is_active:
          type: boolean
        status:
          $ref: "#/components/schemas/LabTestStatus"
        fasting:
          type: boolean
          default: false
        lab:
          anyOf:
            - $ref: "#/components/schemas/ClientFacingLab"
            - type: "null"
        markers:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ClientFacingMarker"
            - type: "null"
        is_delegated:
          type: boolean
          default: false
        auto_generated:
          type: boolean
          default: false
        has_collection_instructions:
          type: ["boolean", "null"]
        common_tat_days:
          type: ["integer", "null"]
        worst_case_tat_days:
          type: ["integer", "null"]
    LabTestResourcesResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClientFacingLabTest"
        next_cursor:
          type: ["string", "null"]
    ClientFacingResult:
      type: object
      required: [name, slug, type]
      properties:
        name:
          type: string
        slug:
          type: string
        provider_id:
          type: ["string", "null"]
