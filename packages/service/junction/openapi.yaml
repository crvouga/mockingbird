  /v3/order/psc/appointment/availability:
    post:
      operationId: get_psc_appointment_availability_v3_order_psc_appointment_availability_post
      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: true
          reason: >-
            availability slots are provider-side data whose values shift between sandbox calls;
            covered by the mock-internal scheduling property suite instead
      parameters:
        - name: lab
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AppointmentPscLabs"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: site_codes
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded array of site codes
        - name: zip_code
          in: query
          required: false
          schema:
            type: string
        - name: radius
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AllowedRadius"
        - name: allow_stale
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentAvailabilitySlots"
        "404":
          description: No slots found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
