    ClientFacingPatientDetailsCompatible:
      type: object
      required: [first_name, last_name, dob, gender, phone_number, email]
      properties:
        first_name:
          type: string
          minLength: 1
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9 .,'-]*$"
          examples: [Ada, Chris, Maria, Jun]
        last_name:
          type: string
          minLength: 1
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9 .,'-]*$"
          examples: [Lovelace, Vouga, Delgado, Park]
        dob:
          type: string
          format: date-time
          examples: [1990-06-15T00:00:00.000Z, 1983-02-02T00:00:00.000Z]
        gender:
          type: string
          minLength: 1
          pattern: "\\S"
          examples: [male, female, other, prefer_not_to_say]
        phone_number:
          type: string
          minLength: 1
          pattern: "^\\+1[2-9]\\d{9}$"
          examples: ["+14155550123", "+12125550987", "+13105554444"]
        email:
          type: string
          format: email
          minLength: 1
          examples: [ada@example.com, chris@example.com, maria@example.com]
    PatientAddressCompatible:
      type: object
      required: [first_line, city, state, zip, country]
      properties:
        receiver_name:
          type: string
          default: ""
          examples: [Ada Lovelace, Chris Vouga]
        first_line:
          type: string
          minLength: 1
          pattern: "\\S"
          examples: ["1 Main St", "450 Market St", "88 Kearny St"]
        second_line:
          type: ["string", "null"]
        city:
          type: string
          minLength: 1
          pattern: "\\S"
          examples: [San Diego, San Francisco, New York]
        state:
          type: string
          minLength: 1
          enum: [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
        zip:
          type: string
          pattern: "^\\d{5}(-\\d{4})?$"
          examples: ["92101", "94105", "10001"]
        country:
          type: string
          minLength: 1
          pattern: "\\S"
          examples: [US]
        access_notes:
          type: ["string", "null"]
          examples: [null]
        phone_number:
          type: ["string", "null"]
          examples: ["+14155550123", null]
