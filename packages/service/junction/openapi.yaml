            minLength: 5
        - name: lab_id
          in: query
          required: true
          schema:
            type: integer
        - name: radius
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AllowedRadius"
        - name: capabilities
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LabLocationCapability"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PscInfo"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
