      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: true
          reason: >-
            appointment payloads embed provider-side slot data; covered by the mock-internal
            scheduling property suite instead
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFacingAppointment"
        "404":
          description: No appointment for this order
