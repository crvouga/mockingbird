openapi: 3.1.0
info:
  title: Junction API (Mockingbird subset)
  description: |
    Stateful mock subset of the Junction (Vital) API.
    Docs: https://docs.junction.com/
    Auth: https://docs.junction.com/api-details/junction-api
    Create user: https://docs.junction.com/api-reference/user/create-user
    Get user: https://docs.junction.com/api-reference/user/get-user
    Delete user: https://docs.junction.com/api-reference/user/delete-user
    Resolve user: https://docs.junction.com/api-reference/user/resolve-user
    Update user: https://docs.junction.com/api-reference/user/patch-user
    Get users: https://docs.junction.com/api-reference/user/get-users
    Create order: https://docs.junction.com/api-reference/lab-testing/create-order
    Get order: https://docs.junction.com/api-reference/lab-testing/get-order
    Get orders: https://docs.junction.com/api-reference/lab-testing/get-orders
    Get order transaction: https://docs.junction.com/api-reference/lab-testing/order-transactions/get-order-transaction
    Get order transaction result: https://docs.junction.com/api-reference/lab-testing/results/get-order-transaction-results
    Lab tests: https://docs.junction.com/api-reference/lab-testing/tests-paginated
    Appointment availability: https://docs.junction.com/api-reference/lab-testing/appointments/get-appointment-availability
    Book appointment: https://docs.junction.com/api-reference/lab-testing/appointments/book-appointment
    Get appointment: https://docs.junction.com/api-reference/lab-testing/appointments/get-appointment
    Reschedule appointment: https://docs.junction.com/api-reference/lab-testing/appointments/reschedule-appointment
    Cancel appointment: https://docs.junction.com/api-reference/lab-testing/appointments/cancel-appointment
    Appointment cancellation reasons: https://docs.junction.com/api-reference/lab-testing/appointments/get-appointment-cancellation-reasons
    Area info: https://docs.junction.com/api-reference/lab-testing/service-areas/get-area-info
    PSC info: https://docs.junction.com/api-reference/lab-testing/service-areas/get-psc-info
    Lab locations: https://docs.junction.com/api-reference/lab-testing/service-areas/get-lab-locations
    Raw results: https://docs.junction.com/api-reference/lab-testing/results/get-lab-results
    Result metadata: https://docs.junction.com/api-reference/lab-testing/results/get-lab-results-metadata
    Result PDF: https://docs.junction.com/api-reference/lab-testing/results/get-lab-result-pdf
    Requisition form PDF: https://docs.junction.com/api-reference/lab-testing/orders/get-requisition-form
    List labs: https://docs.junction.com/api-reference/lab-testing/tests/get-labs
    Test markers: https://docs.junction.com/api-reference/lab-testing/tests/get-markers-for-lab-test
    Order-set markers: https://docs.junction.com/api-reference/lab-testing/results/get-order-set-markers
    Latest user info: https://docs.junction.com/api-reference/user/get-latest-user-info
  version: "0.4.758"
  x-mockingbird-upstream:
    docs: https://docs.junction.com/
    note: Hand-authored subset from Junction public OpenAPI snippets in the docs.
servers:
  - url: https://api.sandbox.us.junction.com
security:
  - apiKeyAuth: []
paths:
  /v2/user:
    post:
      operationId: create_user_v2_user_post
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateBody"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFacingUser"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUserIDConflictResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      operationId: get_teams_users_v2_user_get
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 500
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsersResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Internal Server Error
          content:
            text/plain:
              schema:
                type: string
  /v2/user/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-mockingbird-resource-ref:
            type: user
            missing: "00000000-0000-4000-8000-000000000000"
    get:
      operationId: get_user_v2_user__user_id__get
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFacingUser"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      operationId: delete_user_v2_user__user_id__delete
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccessResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      operationId: patch_user_v2_user__user_id__patch
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchBody"
      responses:
        "204":
          description: Successful Response
        "400":
          description: Nothing to patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v2/user/resolve/{client_user_id}:
    parameters:
      - name: client_user_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: get_user_by_client_user_id_v2_user_resolve__client_user_id__get
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ClientFacingUser"
                  - $ref: "#/components/schemas/PaginatedUsersResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v2/user/{user_id}/info:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-mockingbird-resource-ref:
            type: user
            missing: "00000000-0000-4000-8000-000000000000"
    patch:
      operationId: patch_user_info_v2_user__user_id__info_patch
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInfoPatchBody"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v2/user/{user_id}/info/latest:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-mockingbird-resource-ref:
            type: user
            missing: "00000000-0000-4000-8000-000000000000"
    get:
      operationId: get_latest_user_info_user_v2_user__user_id__info_latest_get
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Successful Response
