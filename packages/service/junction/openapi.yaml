  /v3/order/phlebotomy/appointment/availability:
    post:
      operationId: get_phlebotomy_appointment_availability_v3_order_phlebotomy_appointment_availability_post
      x-mockingbird:
        supported: true
        parity:
          enabled: false
          safe: true
          reason: >-
            availability slots are provider-side data whose values shift between sandbox calls;
            covered by the mock-internal scheduling property suite instead
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsAddress"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentAvailabilitySlots"
        "404":
          description: No availability found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
