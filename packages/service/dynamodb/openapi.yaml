openapi: 3.1.0
info:
  title: Amazon DynamoDB (Mockingbird subset)
  version: "2012-08-10"
  description: AWS JSON DynamoDB contract used by AWS SDK v3.
servers:
  - url: https://dynamodb.us-east-1.amazonaws.com
paths:
  /:
    post:
      operationId: DynamoDbRpc
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: X-Amz-Target, in: header, required: true, schema: { type: string, pattern: '^DynamoDB_20120810\\.[A-Za-z]+$' } }
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0: { schema: { type: object, additionalProperties: true } }
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        "200": { description: Operation response, content: { application/x-amz-json-1.0: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: DynamoDB exception, content: { application/x-amz-json-1.0: { schema: { type: object, additionalProperties: true } } } }
