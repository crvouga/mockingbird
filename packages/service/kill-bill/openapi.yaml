openapi: 3.1.0
info: { title: Kill Bill Billing API (Mockingbird subset), version: "1.0", description: Stateful REST billing contract. }
servers: [{ url: http://127.0.0.1:8080 }]
paths:
  /1.0/kb/accounts/pagination:
    get:
      operationId: PaginateAccounts
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: accountWithBalance
          in: query
          schema:
            type: boolean
            default: false
        - name: accountWithBalanceAndCBA
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Tenant-scoped records in insertion order (negative limit reverses
            order)
          headers: &a1
            X-Killbill-Pagination-CurrentOffset:
              description: Pagination metadata
              schema:
                type: string
            X-Killbill-Pagination-NextOffset:
              description: Absent on the terminal page
              schema:
                type: string
            X-Killbill-Pagination-TotalNbRecords:
              description: Pagination metadata
              schema:
                type: string
            X-Killbill-Pagination-MaxNbRecords:
              description: Pagination metadata
              schema:
                type: string
            X-Killbill-Pagination-NextPageUri:
              description: Absent on the terminal page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - accountId
                    - externalKey
                    - currency
                    - timeZone
                    - referenceTime
                    - accountBalance
                    - accountCBA
                  properties:
                    accountId:
                      type: string
                      x-mockingbird-resource:
                        type: account
                        identity: true
                    externalKey:
                      type: string
                    currency:
                      type: string
                    timeZone:
                      type: string
                    referenceTime:
                      type: string
                      x-mockingbird-volatile:
                        kind: timestamp
                    accountBalance:
                      type:
                        - number
                        - "null"
                    accountCBA:
                      type:
                        - number
                        - "null"
        "400":
          description: Invalid offset/limit
        "401":
          description: Invalid Basic or tenant credentials
  /1.0/kb/invoices/pagination:
    get:
      operationId: PaginateInvoices
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Tenant-scoped records in insertion order (negative limit reverses
            order)
          headers: *a1
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - invoiceId
                    - accountId
                    - invoiceNumber
                    - invoiceDate
                    - targetDate
                    - currency
                    - status
                    - amount
                    - balance
                    - creditAdj
                    - refundAdj
                    - items
                  properties:
                    invoiceId:
                      type: string
                      x-mockingbird-resource:
                        type: invoice
                        identity: true
                    accountId:
                      type: string
                    invoiceNumber:
                      type: string
                    invoiceDate:
                      type: string
                    targetDate:
                      type: string
                    currency:
                      type: string
                    status:
                      type: string
                      enum:
                        - COMMITTED
                        - VOID
                    amount:
                      type: number
                    balance:
                      type: number
                    creditAdj:
                      type: number
                    refundAdj:
                      type: number
                    items:
                      type: array
                      items:
                        type: object
        "400":
          description: Invalid offset/limit
        "401":
          description: Invalid Basic or tenant credentials

  /1.0/kb/tenants:
    get:
      operationId: GetTenantByApiKey
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
      parameters: [{ name: apiKey, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: Tenant }
        "404": { description: Tenant not found }
    post:
      operationId: CreateTenant
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey: { type: string }
                apiSecret: { type: string }
                externalKey: { type: string }
      responses:
        "201": { description: Tenant created }
        "409": { description: Tenant already exists }
  /1.0/kb/tenants/registerNotificationCallback:
    get:
      operationId: GetNotificationCallbacks
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
      responses: { "200": { description: Registered push notification callbacks } }
    post:
      operationId: RegisterNotificationCallback
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters: [{ name: cb, in: query, required: true, schema: { type: string } }]
      responses: { "201": { description: Callback registered } }
    delete:
      operationId: DeleteNotificationCallbacks
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      responses: { "204": { description: Callbacks deleted } }
  /1.0/kb/test/queues:
    get:
      operationId: WaitForQueues
      parameters:
        - { name: timeoutSec, in: query, required: false, schema: { type: integer, default: 5 } }
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
      responses:
        "200": { description: Tenant bus and due notifications are caught up }
        "412": { description: Timeout elapsed while notifications or bus events are still queued }
  /1.0/kb/{resource}:
    parameters: [{ name: resource, in: path, required: true, schema: { type: string } }]
    get: { operationId: ReadResource, x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }, responses: { "200": { description: Resource response } } }
    post: { operationId: CreateResource, x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }, requestBody: { content: { application/json: { schema: { type: object, additionalProperties: true } }, application/xml: { schema: { type: string } } } }, responses: { "201": { description: Created } } }
  /1.0/kb/{resource}/{id}:
    parameters: [{ name: resource, in: path, required: true, schema: { type: string } }, { name: id, in: path, required: true, schema: { type: string } }]
    get: { operationId: GetResource, x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }, responses: { "200": { description: Resource response } } }
    put: { operationId: UpdateResource, x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }, requestBody: { content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "204": { description: Updated } } }
    delete: { operationId: DeleteResource, x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }, responses: { "204": { description: Deleted } } }
  /1.0/kb/subscriptions/{subscriptionId}/undoChangePlan:
    parameters: [{ name: subscriptionId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: UndoChangeSubscriptionPlan
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      responses:
        "204": { description: Pending plan change undone }
        "400": { description: Subscription has no pending plan change }
        "404": { description: Subscription not found }
  /1.0/kb/invoices/{invoiceId}/voidInvoice:
    parameters: [{ name: invoiceId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: VoidInvoice
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      responses:
        "204": { description: Invoice voided }
        "400": { description: Invoice is paid or already void }
        "404": { description: Invoice not found }
  /1.0/kb/invoices:
    post:
      operationId: CreateFutureInvoice
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: string } }
        - { name: targetDate, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "201": { description: Invoice for every period starting on or before targetDate (Location) }
        "400": { description: InvoiceApiException 4005 (target 37 months or more ahead) or 4 (more than 15 items for a subscription in a day) }
        "404": { description: Nothing to invoice (Tomcat page, no entity), or the account does not exist }
  /1.0/kb/invoices/{invoiceId}/commitInvoice:
    parameters: [{ name: invoiceId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: CommitInvoice
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      responses:
        "204": { description: A DRAFT invoice becomes COMMITTED }
        "404": { description: Invoice not found }
  /1.0/kb/paymentTransactions:
    get:
      operationId: GetPaymentByTransactionExternalKey
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
      parameters:
        - { name: transactionExternalKey, in: query, required: true, schema: { type: string } }
        - { name: audit, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: The payment holding the transaction (Kill Bill 0.24.16 PaymentJson) }
        "404": { description: PaymentApiException 7020, no transaction with that key }
  /1.0/kb/accounts/{accountId}/overdue:
    parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: GetAccountOverdue
      x-mockingbird: { supported: true, parity: { enabled: true, safe: true } }
      responses:
        "200":
          description: Account overdue state (Kill Bill 0.24.10 OverdueStateJson)
          content:
            application/json:
              schema:
                type: object
                required: [name, isClearState]
                properties:
                  name: { type: string }
                  externalMessage: { type: string }
                  isDisableEntitlementAndChangesBlocked: { type: boolean }
                  isBlockChanges: { type: boolean }
                  isClearState: { type: boolean }
                  reevaluationIntervalDays: { type: ["integer", "null"] }
        "404": { description: Account not found }
  /1.0/kb/security/permissions:
    get:
      operationId: GetUserPermissions
      description: Global permissions for the configured emulator administrator. Best guess, not oracle-verified; returns the default Shiro root permission '*:*'.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; see README for contract and limits", parity: { enabled: true, safe: true } }
      responses:
        "200":
          description: Permission strings; Basic authentication only, no tenant headers
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "401": { description: Invalid or missing Basic credentials }
  /1.0/kb/accounts/{accountId}:
    parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: UpdateAccount
      description: Partial name/email update. Best guess, not oracle-verified; changed immutable fields and other update fields are rejected without mutation.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; see README for contract and limits", parity: { enabled: true, safe: false } }
      parameters: [{ name: treatNullAsReset, in: query, schema: { type: boolean, default: false } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, "null"] }
                email: { type: [string, "null"] }
              additionalProperties: true
      responses:
        "204": { description: Account updated }
        "400": { description: Invalid immutable field change or unsupported update field }
        "404": { description: Account not found }
  /1.0/kb/subscriptions/{subscriptionId}/block:
    parameters: [{ name: subscriptionId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: AddSubscriptionBlockingState
      description: Best guess, not oracle-verified; billing-only blocking states, with entitlement/change blocking explicitly unsupported.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; see README for contract and limits", parity: { enabled: true, safe: false } }
      parameters: [{ name: requestedDate, in: query, schema: { type: string, format: date } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stateName, service, isBlockBilling]
              properties:
                stateName: { type: string }
                service: { type: string }
                isBlockBilling: { type: boolean }
                isBlockChange: { type: boolean }
                isBlockEntitlement: { type: boolean }
      responses:
        "201": { description: Blocking state recorded }
        "400": { description: Invalid or unsupported blocking state }
        "404": { description: Subscription not found }
  /1.0/kb/subscriptions/{subscriptionId}/bcd:
    parameters: [{ name: subscriptionId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: UpdateSubscriptionBCD
      description: Best guess, not oracle-verified; monthly billing uses the selected calendar day with full charges and no proration.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; see README for contract and limits", parity: { enabled: true, safe: false } }
      parameters:
        - { name: effectiveFromDate, in: query, schema: { type: string, format: date } }
        - { name: forceNewBcdWithPastEffectiveDate, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billCycleDayLocal]
              properties:
                subscriptionId: { type: string }
                billCycleDayLocal: { type: integer, minimum: 1, maximum: 31 }
      responses:
        "204": { description: Billing day scheduled }
        "400": { description: Invalid or unsupported billing day update }
        "404": { description: Subscription not found }
  /1.0/kb/invoices/dryRun:
    post:
      operationId: GenerateDryRunInvoice
      description: Best guess, not oracle-verified; TARGET_DATE previews without persisting invoices or advancing billing state.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; see README for contract and limits", parity: { enabled: true, safe: true } }
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: string } }
        - { name: targetDate, in: query, schema: { type: string, format: date } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRunType: { type: string, enum: [TARGET_DATE] }
      responses:
        "200": { description: Preview invoice with subscription items }
        "204": { description: Nothing to invoice }
        "400": { description: Invalid date or unsupported dry-run type/action }
        "404": { description: Account not found }
  /1.0/kb/invoices/{invoiceId}:
    parameters: [{ name: invoiceId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: AdjustInvoiceItem
      description: Best guess, not oracle-verified; adds a negative ITEM_ADJ linked to the original item, bounded by its remaining adjustable amount.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; see README for contract and limits", parity: { enabled: true, safe: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, invoiceItemId]
              properties:
                accountId: { type: string }
                invoiceItemId: { type: string }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string }
                description: { type: string }
      responses:
        "201": { description: Item adjusted; Location points to invoice }
        "400": { description: Invalid item, amount, account or currency }
        "404": { description: Invoice not found }
  /1.0/kb/accounts/{accountId}/invoicePayments:
    parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: PayAccountInvoices
      description: Best guess, not oracle-verified; pays full outstanding balances and emits invoice payment events. Partial paymentAmount and pluginProperty options are explicitly unsupported.
      x-mockingbird: { supported: true, reason: "Best guess, not oracle-verified; full balances only; paymentAmount and pluginProperty explicitly unsupported", parity: { enabled: true, safe: false } }
      parameters:
        - { name: targetDate, in: query, schema: { type: string, format: date } }
        - { name: externalPayment, in: query, schema: { type: boolean } }
        - { name: paymentMethodId, in: query, schema: { type: string } }
      responses:
        "201": { description: Payments attempted; Location points to account invoices }
        "204": { description: No outstanding invoices }
        "400": { description: Invalid payment method, date, or unsupported payment options }
        "404": { description: Account not found }
  /1.0/kb/subscriptions/{subscriptionId}:
    parameters: [{ name: subscriptionId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: ChangeSubscriptionPlan
      description: Plan change by planName, or by productName + billingPeriod (+ priceList). The emulator keeps one price list, so priceList only appears in the 2020 message (best guess, not oracle-verified).
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: billingPolicy, in: query, schema: { type: string, enum: [IMMEDIATE, END_OF_TERM] } }
        - { name: requestedDate, in: query, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                planName: { type: string }
                productName: { type: string }
                billingPeriod: { type: string }
                priceList: { type: string }
                priceOverrides: { type: array, items: { type: object } }
              additionalProperties: true
      responses:
        "204": { description: Plan changed or scheduled }
        "400": { description: "CatalogApiException (Kill Bill 0.24.10): 2021 no plan by that name, 2020 no plan for that product, billing period and price list, 2030 no such product" }
        "404": { description: Subscription not found }
  /1.0/kb/invoicePayments/{paymentId}/refunds:
    parameters: [{ name: paymentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: RefundInvoicePayment
      description: "Kill Bill 0.24.10: with externalPayment=true a CREDIT payment is recorded (any amount, also above the payment); isAdjusted with an adjustments list writes ITEM_ADJ items that lower the invoice amount (balance unchanged, refundAdj negative), isAdjusted without one leaves the invoice alone. Without externalPayment, isAdjusted needs an adjustments list."
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: externalPayment, in: query, schema: { type: boolean } }
        - { name: paymentMethodId, in: query, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                currency: { type: string }
                transactionExternalKey: { type: string }
                paymentExternalKey: { type: string }
                isAdjusted: { type: boolean }
                adjustments: { type: array, items: { type: object } }
              additionalProperties: true
      responses:
        "201": { description: Refund (or external CREDIT) recorded; Location points to the payment }
        "400": { description: "REFUND_AMOUNT_TOO_HIGH (not external), PaymentApiException 7199 (isAdjusted without adjustments, not external), or a reused transaction key" }
        "404": { description: Payment not found }
