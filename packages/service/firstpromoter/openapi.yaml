openapi: 3.1.0
info:
  title: FirstPromoter API v2 (Mockingbird subset)
  description: |
    Stateful emulator subset of FirstPromoter's v2 company API: promoters (create, list, find by
    id / cust_id / ref_token / email, update, archive), signup tracking, and the dashboard
    iframe login. Hand-authored from the wire shapes our consumer sends and the zod schemas it
    parses responses with (`first-promoter.types.ts`).
  version: "2"
  x-mockingbird-upstream:
    note: >-
      Hand-authored from B/global-services/services/first-promoter/first-promoter.service.ts and
      first-promoter.types.ts (FirstPromoterV2ResponseSchema, FirstPromoterV2ListResponseSchema,
      FirstPromoterV2ArchiveResponseSchema, FirstPromoterAccessTokenResponseSchema).
servers:
  - url: https://api.firstpromoter.com/api
security:
  - bearerAuth: []
paths:
  /v2/track/signup:
    post:
      operationId: TrackSignup
      description: |
        Record a referred signup, attributed by click `tid`, by `promoter_id`, or by `ref_id`
        (a promoter's ref token). Attributed signups emit the `lead_becomes_referral` webhook.
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 120
                uid:
                  type: string
                  maxLength: 64
                tid:
                  type: string
                  maxLength: 64
                ref_id:
                  type: string
                  maxLength: 64
                promoter_id:
                  type: integer
                  minimum: 1
                skip_email_notification:
                  type: boolean
      responses:
        "200":
          description: The referral
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
        "400":
          description: No attribution given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown tid, promoter or ref token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid or already-tracked email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /v2/company/promoters:
    get:
      operationId: ListPromoters
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of promoters
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Promoter"
                  meta:
                    type: object
                    required: [pending_count]
                    properties:
                      pending_count:
                        type: integer
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: CreatePromoter
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 120
                cust_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                profile:
                  type: object
                  properties:
                    first_name:
                      type: string
                      maxLength: 40
                    last_name:
                      type: string
                      maxLength: 40
                drip_emails:
                  type: boolean
                initial_campaign_id:
                  type: integer
                  minimum: 1
                  maximum: 3
      responses:
        "200":
          description: The new promoter, enrolled in the default campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promoter"
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown initial campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid, or email / cust_id already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /v2/company/promoters/archive:
    post:
      operationId: ArchivePromoters
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: integer
                    minimum: 1
      responses:
        "200":
          description: The batch operation that archived them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProcess"
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /v2/company/promoters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The promoter id, or the value named by `find_by`.
        schema:
          type: string
          x-mockingbird-resource-ref:
            type: ref_token
            missing: nobody404
    get:
      operationId: GetPromoter
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: find_by
          in: query
          schema:
            type: string
            enum: [id, cust_id, auth_token, ref_token, promo_code, email]
      responses:
        "200":
          description: The promoter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promoter"
        "400":
          description: Unknown find_by
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such promoter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: UpdatePromoter
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 120
                cust_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                note:
                  type: string
                  maxLength: 200
                profile:
                  type: object
                  properties:
                    first_name:
                      type: string
                      maxLength: 40
                    last_name:
                      type: string
                      maxLength: 40
      responses:
        "200":
          description: The updated promoter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promoter"
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such promoter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid, or email / cust_id already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /v2/promoters/iframe_login:
    post:
      operationId: IframeLogin
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: promoter_id
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{1,10}$"
      responses:
        "200":
          description: A short-lived dashboard token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token:
                    type: string
                    x-mockingbird-volatile:
                      kind: token
                  expires_in:
                    type: integer
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such promoter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v2/company/referrals:
    get:
      operationId: ListReferrals
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Referral read
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralDetail"
        "401": &a1
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": &a2
          description: No such promoter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Filtered referral collection, as the vendor's bare array;
        page/per_page follow the official n8n client.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: q
          in: query
          schema:
            type: string
        - name: ids[]
          in: query
          schema:
            type: array
            items:
              type: integer
        - name: filters[type]
          in: query
          schema:
            type: string
            enum:
              - lead
              - customer
        - name: filters[state]
          in: query
          schema:
            type: string
            enum:
              - signup
              - active
              - cancelled
              - refunded
              - denied
        - name: filters[promoter_id]
          in: query
          schema:
            type: string
        - name: filters[created_at][from]
          in: query
          schema:
            type: string
            format: date
        - name: filters[created_at][to]
          in: query
          schema:
            type: string
            format: date
        - name: filters[customer_since][from]
          in: query
          schema:
            type: string
            format: date
        - name: filters[customer_since][to]
          in: query
          schema:
            type: string
            format: date
  /v2/company/referrals/{id}:
    get:
      operationId: GetReferral
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Referral read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralDetail"
        "401": *a1
        "404": *a2
      description: Retrieve a stored referral by numeric ID, or by email/uid when
        find_by is set.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: ["91000001", "999999999"]
        - name: find_by
          in: query
          schema:
            type: string
            enum:
              - email
              - uid
  /v2/company/commissions:
    get:
      operationId: ListCommissions
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commission"
        "401":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: q
          in: query
          schema:
            type: string
        - name: ids[]
          in: query
          schema:
            type: array
            items:
              type: integer
        - name: filters[status]
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - denied
        - name: filters[paid]
          in: query
          schema:
            type: string
            enum:
              - yes
              - no
        - name: filters[fulfilled]
          in: query
          schema:
            type: string
            enum:
              - yes
              - no
        - name: filters[promoter_id]
          in: query
          schema:
            type: integer
        - name: filters[campaign_id]
          in: query
          schema:
            type: integer
        - name: filters[amount][from]
          in: query
          schema:
            type: integer
        - name: filters[amount][to]
          in: query
          schema:
            type: integer
        - name: filters[sale_amount][from]
          in: query
          schema:
            type: integer
        - name: filters[sale_amount][to]
          in: query
          schema:
            type: integer
        - name: filters[created_at][from]
          in: query
          schema:
            type: string
            format: date
        - name: filters[created_at][to]
          in: query
          schema:
            type: string
            format: date
  /v2/company/commissions/mark_fulfilled:
    post:
      operationId: FulfillCommissions
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProcess"
        "202":
          description: Accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProcess"
        "401":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
  /v2/company/commissions/destroy:
    delete:
      operationId: DestroyCommissions
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProcess"
        "202":
          description: Accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProcess"
        "401":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
  /v2/company/commissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id of the commission.
        schema:
          type: integer
    put:
      operationId: UpdateCommission
      description: Update the notes of a commission (the vendor's `CommissionUpdate` schema).
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                internal_note:
                  type: string
                  description: Visible only to the team
                external_note:
                  type: string
                  description: Visible to the promoter
      responses:
        "200":
          description: Commission updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commission"
        "401":
          description: Missing API key or Account-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Commission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /v2/company/batch_processes:
    get:
      operationId: ListBatchProcesses
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchProcess"
        "401":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - &a1
          name: filters[status]
          in: query
          schema:
            type: string
            enum:
              - pending
              - in_progress
              - completed
              - failed
              - stopped
  /v2/company/batch_processes/progress:
    get:
      operationId: BatchProcessProgress
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
        "401":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - *a1
  /v2/company/batch_processes/{id}:
    get:
      operationId: GetBatchProcess
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProcess"
        "401":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum:
              - "300001"
              - "999999999"
  /v2/track/sale:
    post:
      operationId: TrackSale
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
                - amount
              oneOf:
                - required:
                    - email
                - required:
                    - uid
              properties:
                event_id:
                  type: string
                  minLength: 1
                  maxLength: 120
                amount:
                  type: integer
                  minimum: 1
                email:
                  type: string
                  format: email
                  maxLength: 120
                uid:
                  type: string
                  minLength: 1
                  maxLength: 64
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                plan:
                  type: string
                promo_code:
                  type: string
                ref_id:
                  type: string
                tid:
                  type: string
                skip_email_notification:
                  type: boolean
      responses:
        "200":
          description: Sale and its commissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No eligible referral
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                      - not_found
        "409":
          description: Duplicate sale event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <FIRST_PROMOTER_API_KEY>` plus `Account-ID: <FIRST_PROMOTER_ACCOUNT_ID>`."
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Reward:
      type: object
      required: [apply_on, reward_id]
      properties:
        apply_on:
          type: string
        product_ids:
          type: ["array", "null"]
          items:
            type: integer
        reward_id:
          type: integer
        reward:
          type: ["object", "null"]
          properties:
            name:
              type: ["string", "null"]
            promoter_reward_type:
              type: ["string", "null"]
            hide_reward:
              type: ["boolean", "null"]
            tier_level:
              type: ["integer", "null"]
            coupon:
              type: ["string", "null"]
            amount:
              type: ["number", "null"]
            unit:
              type: ["string", "null"]
            reward_value:
              type: ["number", "null"]
            reward_unit:
              type: ["string", "null"]
        products:
          type: ["array", "null"]
    CampaignStats:
      type: object
      required: [clicks_count, referrals_count, sales_count, customers_count, revenue_amount]
      properties:
        clicks_count:
          type: integer
        referrals_count:
          type: integer
        sales_count:
          type: integer
        customers_count:
          type: integer
        revenue_amount:
          type: number
    PromoterCampaign:
      type: object
      required: [id, campaign_id, promoter_id, state, ref_link]
      properties:
        id:
          type: integer
          x-mockingbird-volatile:
            kind: id
        campaign_id:
          type: integer
        promoter_id:
          type: integer
          x-mockingbird-volatile:
            kind: id
        state:
          type: string
        created_at:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        campaign:
          type: object
          required: [id, name, color]
          properties:
            id:
              type: integer
            name:
              type: string
            color:
              type: string
        ref_link:
          type: string
          x-mockingbird-volatile:
            kind: url
        ref_token:
          type: string
          x-mockingbird-resource:
            type: ref_token
            identity: true
        coupon:
          type: ["string", "null"]
        display_coupon:
          type: ["string", "null"]
        direct_url:
          type: ["string", "null"]
        track_ad_traffic:
          type: ["string", "null"]
        referral_rewards_customized:
          type: boolean
        promoter_rewards_customized:
          type: boolean
        rewards_for_promoters:
          type: array
          items:
            $ref: "#/components/schemas/Reward"
        rewards_for_referrals:
          type: array
          items:
