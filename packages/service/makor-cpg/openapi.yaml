openapi: 3.1.0
info:
  title: Legacy Makor AI API "CPG" (Mockingbird subset)
  description: |
    Stateful mock subset of the legacy Makor AI ("CPG") API: care-plan details and the plus-user
    toggle (Intercom sync, user-actions queue), the bloodwork-results webhook (ODX), subscription
    and Wholescripts order reads, AI patient summaries and async-review scripts (called
    browser-direct from the EMR frontend). Not the in-repo makor-ecosystem gateway.
  version: "1"
  x-mockingbird-upstream:
    note: >-
      Hand-authored from the consumer's wire shapes: backend makor-ai.types.ts and
      makor-ai-client.service.ts; EMR frontend cpg-api.ts, user-summary.service.ts,
      async-review-script.service.ts and types/async-review-script.types.ts. The vendor
      publishes no spec.
servers:
  - url: https://makor-ai-api.up.railway.app
security:
  - apiKey: []
paths:
  /api/care-plans/current-care-plan-details/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: GetCurrentCarePlan
      description: A 404 naming the user means "no active or approved care plan" (the normal case).
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The current care plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarePlanStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/care-plans/plus-user/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: UpdatePlusUser
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plusUser]
              properties:
                plusUser:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bloodwork/webhook:
    post:
      operationId: BloodworkResultsReceived
      description: ODX tells Makor new lab results exist; accepted asynchronously (202).
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, labResultsId]
              properties:
                userId:
                  type: string
                  minLength: 1
                  maxLength: 40
                labResultsId:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/subscription/cancel/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: CancelSubscription
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: Cancelled, already cancelled, or nothing to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelSubscriptionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/subscription/status/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: GetSubscriptionStatus
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The subscription, or hasActiveSubscription false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/wholescripts-orders/user/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: GetWholescriptsOrders
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/generate-user-summary:
    post:
      operationId: GenerateUserSummary
      description: >-
        Synchronous: answers the finished summary and stores it as the user's most recent. The
        real server takes 30-50 s; the mock answers at once (preset slow_generation adds it back).
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateUserSummaryRequest"
      responses:
        "200":
          description: The generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullUserSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v2/user-summary/{cpgUserId}:
    parameters:
      - name: cpgUserId
        in: path
        required: true
        schema:
          type: string
          x-mockingbird-resource-ref:
            type: user
            missing: "999999999"
    get:
      operationId: GetUserSummary
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The most recent summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/async-review-script/{userId}/{labTestId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/LabTestId"
    get:
      operationId: GetReviewScript
      description: The most recent review for the lab test; `processing` until N ms have passed on the mock clock.
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review:
                    $ref: "#/components/schemas/AsyncReviewScript"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/async-review-script/generate:
    post:
      operationId: GenerateReviewScript
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [userId, labTestId]
                  properties:
                    userId:
                      type: string
                      minLength: 1
                      maxLength: 40
                      x-mockingbird-resource-ref:
                        type: user
                        missing: "999999999"
                    labTestId:
                      $ref: "#/components/schemas/LabTestIdValue"
                - $ref: "#/components/schemas/ReviewScriptOptions"
      responses:
        "200":
          description: Generated (complete) or accepted (processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateReviewResponse"
  /api/async-review-script/regenerate/{userId}/{labTestId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/LabTestId"
    post:
      operationId: RegenerateReviewScript
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewScriptOptions"
      responses:
        "200":
          description: Regenerated (complete) or accepted (processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateReviewResponse"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: user
          missing: "999999999"
    LabTestId:
      name: labTestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/LabTestIdValue"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or unknown x-api-key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No such record for this user (a normal outcome)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Generation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LabTestIdValue:
      description: >-
        Any non-empty id. The first branch only steers the walk generator toward a small
        alphabet, so random walks revisit the lab tests they generated scripts for.
      anyOf:
        - type: string
          pattern: "^lab_[0-3]$"
        - type: string
          minLength: 1
          maxLength: 80
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
    SuccessMessage:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
    Pricing:
      type: object
      required:
        - subtotal_cents
        - shipping_cents
        - tax_cents
        - total_cost_cents_before_discount
        - total_cost_cents
        - discount_percent
        - discount_type
      properties:
        subtotal_cents:
          type: number
        shipping_cents:
          type: number
        tax_cents:
          type: number
        total_cost_cents_before_discount:
          type: number
        total_cost_cents:
          type: number
        discount_percent:
          type: ["number", "null"]
        discount_type:
          type: ["string", "null"]
    CarePlanStatus:
      type: object
      required: [carePlanId, status, pricing, state]
      properties:
        carePlanId:
          type: string
        status:
          type: string
        pricing:
          $ref: "#/components/schemas/Pricing"
        state:
          type: string
    SubscriptionStatusData:
      type: object
      required: [id, user_id, status]
      properties:
        id:
          type: string
        user_id:
          type: string
        stripe_customer_id:
          type: ["string", "null"]
        stripe_subscription_id:
          type: ["string", "null"]
        stripe_checkout_session_id:
          type: ["string", "null"]
        checkout_url:
          type: ["string", "null"]
        cp_id:
          type: ["string", "null"]
        price_cents:
          type: ["number", "null"]
        subtotal_price: {}
        tax_cents:
          type: ["number", "null"]
        shipping_cents:
          type: ["number", "null"]
        discount_percent:
          type: ["number", "null"]
        coupon_id:
          type: ["string", "null"]
        interval_days:
          type: ["number", "null"]
        idempotency_key:
          type: ["string", "null"]
        subscription_intent_id:
          type: ["string", "null"]
        stripe_latest_invoice_id:
          type: ["string", "null"]
        status_reason:
          type: ["string", "null"]
        status:
          type: string
        last_fulfilled_invoice_id:
          type: ["string", "null"]
        next_renewal_date:
          type: ["string", "null"]
        last_invoice_paid_at:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
    SubscriptionStatus:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionStatusData"
            - type: object
              required: [hasActiveSubscription]
              properties:
                hasActiveSubscription:
                  type: boolean
                message:
                  type: string
    CancelSubscriptionResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          oneOf:
            - type: object
              required: [subscription_id, status]
              properties:
                subscription_id:
                  type: string
                status:
                  type: string
                message:
                  type: string
            - type: object
              required: [success]
              properties:
                success:
                  type: boolean
                message:
                  type: string
                alreadyCancelled:
                  type: boolean
    OrderItem:
      type: object
      required: [id, carePlanId, invoiceId, wholeScriptsOrderId, status, tracking, supplements]
      properties:
        id:
          type: number
        carePlanId:
          type: string
        invoiceId:
          type: string
        wholeScriptsOrderId:
          type: string
        submitSuccess:
          type: boolean
        orderDate:
          type: string
        status:
          type: string
        tracking:
          type: array
          items:
            type: object
        shipMethod:
          type: string
        supplements:
          type: array
          items:
            type: object
        billingCycle:
          type: number
        needsPolling:
          type: boolean
        lastPolled:
          type: string
        pricingSnapshot:
          type: object
        createdAt:
          type: string
        updatedAt:
          type: string
        activeCarePlan:
          type: boolean
    OrderHistoryResponse:
      type: object
      required: [data, page, count, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        page:
          type: number
        count:
          type: number
        total:
          type: number
        totalPages:
          type: number
    GenerateUserSummaryRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "\\S"
        intake_forms:
          type: array
          maxItems: 4
          items:
            type: object
            required: [title, content]
            properties:
              title:
                type: string
                maxLength: 80
              content:
                type: string
                maxLength: 400
        free_text_entries:
          type: array
          maxItems: 4
          items:
            type: object
            required: [entry_id, text]
            properties:
              entry_id:
                type: string
                maxLength: 40
              timestamp:
                type: string
                maxLength: 40
              text:
                type: string
                maxLength: 400
        llm_model:
          type: string
          maxLength: 60
    Biomarker:
      type: object
      required: [biomarker_name, value, optimal_range, standard_range, severity_category]
      properties:
        biomarker_name:
          type: string
        value:
          type: number
        optimal_range:
          type: array
          items:
            type: number
        standard_range:
          type: array
          items:
            type: number
        severity_category:
          type: string
    BiomarkerAnalysis:
      description: A single test's analysis, or the with-trends shape (both are passed through).
      type: object
      additionalProperties: true
    FullUserSummary:
      type: object
      required: [user_id, summary, biomarker_analysis]
      properties:
        user_id:
          type: string
          x-mockingbird-resource:
            type: user
            identity: true
        summary:
          type: object
          required: [general_summary, past_visits]
          properties:
            general_summary:
              type: array
              items:
                type: string
            past_visits:
              type: array
              items:
                type: string
            intake_summary:
              type: array
              items:
                type: string
        biomarker_analysis:
          $ref: "#/components/schemas/BiomarkerAnalysis"
    UserSummaryResponse:
      type: object
      required: [cpgUserId, summary, isMostRecent, createdAt]
      properties:
        cpgUserId:
          type: string
        summary:
          $ref: "#/components/schemas/FullUserSummary"
        isMostRecent:
          type: boolean
        createdAt:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
    ReviewScriptOptions:
      type: object
      properties:
        intakeForm:
          type: string
          maxLength: 400
        chartingNotes:
          type: array
          maxItems: 3
          items:
            type: object
            required: [content]
            properties:
              title:
                type: string
                maxLength: 80
              content:
                type: string
                maxLength: 400
              created_at:
                type: string
                maxLength: 40
              provider_name:
                type: string
                maxLength: 80
        demographics:
          type: object
          properties:
            first_name:
              type: string
              maxLength: 40
            last_name:
              type: string
              maxLength: 40
            age:
              type: integer
              minimum: 0
              maximum: 120
            state:
              type: string
              maxLength: 2
    LabFinding:
      type: object
      required: [marker, value, status, interpretation]
      properties:
        marker:
          type: string
        value:
          type: string
        previousValue:
          type: string
        status:
          type: string
          enum: [optimal, low, high, trending_low, trending_high]
        interpretation:
          type: string
    ScriptContent:
      type: object
      required:
        - overview
        - labFindings
        - symptomsVsLabChanges
        - nutritionRecommendations
        - fiberGuidance
        - supplementRecommendations
        - lifestyleRecommendations
        - reflectionQuestions
      properties:
        overview:
          type: object
          required: [summary, patterns]
          properties:
            summary:
              type: string
            patterns:
              type: array
              items:
                type: string
        labFindings:
          type: object
          required: [thyroid, stressAdrenal, metabolicBloodSugar, inflammationImmune, nutrientStatus]
          properties:
            thyroid:
              type: array
              items:
                $ref: "#/components/schemas/LabFinding"
            stressAdrenal:
              type: array
              items:
                $ref: "#/components/schemas/LabFinding"
            metabolicBloodSugar:
              type: array
              items:
                $ref: "#/components/schemas/LabFinding"
            inflammationImmune:
              type: array
              items:
                $ref: "#/components/schemas/LabFinding"
            nutrientStatus:
              type: array
              items:
                $ref: "#/components/schemas/LabFinding"
        symptomsVsLabChanges:
          type: array
          items:
            type: object
            required: [observation, labEvidence]
            properties:
              observation:
                type: string
              labEvidence:
                type: string
        nutritionRecommendations:
          type: array
          items:
            type: object
            required: [recommendation, rationale, priority]
            properties:
              recommendation:
                type: string
              rationale:
                type: string
              priority:
                type: string
                enum: [high, medium, low]
        fiberGuidance:
          type: object
          required: [included, categories]
          properties:
            included:
              type: boolean
            categories:
              type: array
              items:
                type: object
                required: [category, options, howToAdd]
                properties:
                  category:
                    type: string
                  options:
                    type: string
                  howToAdd:
                    type: string
        supplementRecommendations:
          type: array
          items:
            type: object
            required: [supplement, purpose, relevance, timing]
            properties:
              supplement:
                type: string
              purpose:
                type: string
              relevance:
                type: string
              timing:
                type: ["string", "null"]
        lifestyleRecommendations:
          type: array
          items:
            type: object
            required: [area, recommendation]
            properties:
              area:
                type: string
              recommendation:
                type: string
        reflectionQuestions:
          type: array
          items:
            type: string
    AsyncReviewScript:
      type: object
      required: [id, labTestId, reviewType, status, scriptContent, createdAt, updatedAt]
      properties:
        id:
          type: integer
        labTestId:
          type: string
        reviewType:
          type: string
          enum: [initial, comparative]
        status:
          type: string
          enum: [processing, complete, failed]
        scriptContent:
          oneOf:
            - $ref: "#/components/schemas/ScriptContent"
            - type: "null"
        errorMessage:
          type: ["string", "null"]
        metadata:
          type: object
          required: [inputTokens, outputTokens, model, partialParse, generatedAt]
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
            model:
              type: string
            partialParse:
              type: boolean
            generatedAt:
              type: string
              x-mockingbird-volatile:
                kind: timestamp
        isMostRecent:
          type: boolean
        createdAt:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        updatedAt:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
    GenerateReviewResponse:
      type: object
      required: [message, reviewId, status, reviewType, scriptContent]
      properties:
        message:
          type: string
        reviewId:
          type: integer
        status:
          type: string
          enum: [processing, complete, failed]
        reviewType:
          type: string
          enum: [initial, comparative]
        scriptContent:
          oneOf:
            - $ref: "#/components/schemas/ScriptContent"
            - type: "null"
        errorMessage:
          type: string
