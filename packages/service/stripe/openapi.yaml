          x-mockingbird-volatile:
            kind: timestamp
      title: Account
    address:
      properties:
        city:
          maxLength: 5000
          type:
            - string
            - "null"
        country:
          maxLength: 5000
          type:
            - string
            - "null"
        line1:
          maxLength: 5000
          type:
            - string
            - "null"
        line2:
          maxLength: 5000
          type:
            - string
            - "null"
        postal_code:
          maxLength: 5000
          type:
            - string
            - "null"
        state:
          maxLength: 5000
          type:
            - string
            - "null"
      title: Address
      type: object
    api_errors:
      properties:
        advice_code:
          maxLength: 5000
          type: string
        charge:
          maxLength: 5000
          type: string
        code:
          maxLength: 5000
          type: string
        decline_code:
          maxLength: 5000
          type: string
        doc_url:
          maxLength: 5000
          type: string
        message:
          maxLength: 40000
          type: string
        network_advice_code:
          maxLength: 5000
          type: string
        network_decline_code:
          maxLength: 5000
          type: string
        param:
          maxLength: 5000
          type: string
        payment_method_type:
          maxLength: 5000
          type: string
        request_log_url:
          maxLength: 5000
          type: string
          x-mockingbird-volatile:
            kind: url
        type:
          enum:
            - api_error
            - card_error
            - idempotency_error
            - invalid_request_error
          type: string
      required:
        - type
      title: APIErrors
      type: object
    balance:
      type: object
      additionalProperties: true
      required:
        - available
        - livemode
        - object
        - pending
      properties:
        available:
          type: array
        livemode:
          type: boolean
        object:
          type: string
          enum:
            - balance
        pending:
          type: array
      title: Balance
    balance_transaction:
      type: object
      additionalProperties: true
      required:
        - amount
        - available_on
        - balance_type
        - created
        - currency
