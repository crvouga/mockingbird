openapi: 3.1.0
info:
  title: LiveKit Server API (Mockingbird subset)
  version: "2.19.1"
  description: Twirp JSON room, participant, egress, and SIP contract.
servers:
  - url: https://example.livekit.cloud
paths:
  /twirp/livekit.RoomService/{method}:
    post:
      operationId: RoomService
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: method, in: path, required: true, schema: { type: string } }
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Protobuf JSON response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Twirp error, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /twirp/livekit.Egress/{method}:
    post:
      operationId: EgressService
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: method, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Protobuf JSON response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /twirp/livekit.SIP/{method}:
    post:
      operationId: SipService
      x-mockingbird: { supported: true, parity: { enabled: true, safe: false } }
      parameters:
        - { name: method, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Protobuf JSON response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
