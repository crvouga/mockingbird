# Optional native-oracle Postgres for differential tests.
# Prefer `bun run test:postgres-native` (embedded-postgres, no Docker).
#
# Usage:
#   docker compose -f docker-compose.oracle.yml up -d
#   POSTGRES_MEM_ORACLE_URL=postgres://postgres:postgres@127.0.0.1:54329/postgres \
#     bun run test:postgres-native
#   docker compose -f docker-compose.oracle.yml down -v

services:
  oracle:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Match PGlite: RESET timezone restores UTC (not the container/host zone).
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
