# Local replica: bun run check:full (scripts/ci-local.ts)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Direct pushes to main cannot rewrite already-landed messages.
      # Conventional Commits are enforced on pull requests (commits + title).
      # On main, unmatched subjects still publish as a patch (see .releaserc.json).
      - name: Note push commitlint policy
        if: github.event_name == 'push'
        run: |
          set +e
          bunx commitlint --last --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::HEAD is not Conventional Commits. Enforced on PRs. On main, semantic-release still publishes a patch unless a feat/fix/BREAKING message selects a higher bump."
          fi

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          set +e
          bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::One or more PR commits failed Conventional Commits lint."
            echo ""
            echo "Expected format:"
            echo "  <type>(optional-scope): <description>"
            echo ""
            echo "Releasable types: feat, fix (and BREAKING CHANGE / type!)"
            echo "Fix by amending commits or squashing with a conventional PR title."
            echo "See README.md → Releasing"
            exit "$status"
          fi

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: .+
          subjectPatternError: |
            The PR title "{title}" looks empty after the type/scope prefix.
            Use a Conventional Commits title, e.g. "feat: add window functions".

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify package
        run: bun run verify-package

  test:
    name: Test
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:postgres-compat

      - name: Canaries
        run: bun run test:canaries

      - name: Browser SQL smoke
        run: bun run test:browser-sql

  test-native-oracle:
    name: Test (native Postgres oracle)
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Differential suite vs embedded PostgreSQL 18.3
        run: bun run test:postgres-native

  benchmark:
    name: Benchmark
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: CI benchmarks
        run: bun run benchmarks/run.ts --tier ci --engine mem --out benchmarks/results/ci-latest.json

      - name: Regression gate
        run: |
          set +e
          bun -e '
            const baseline = await Bun.file("benchmarks/results/ci-baseline.json").json();
            const current = await Bun.file("benchmarks/results/ci-latest.json").json();
            const bp = baseline.environment?.platform;
            const cp = current.environment?.platform;
            if (bp && cp && bp !== cp) process.exit(2);
          '
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::ci-baseline.json was recorded on another OS. Gating this ubuntu run against itself. Commit the ci-latest-linux artifact as benchmarks/results/ci-baseline.json to enable a real 2.5× gate."
            bun run benchmarks/compare-ci.ts benchmarks/results/ci-latest.json benchmarks/results/ci-latest.json
          elif [ "$status" -ne 0 ]; then
            echo "Failed to read baseline/current bench reports (exit $status)"
            exit "$status"
          else
            bun run benchmarks/compare-ci.ts
          fi

      - name: Memory budget
        run: bun run benchmarks/check-budgets.ts

      - name: Upload CI bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-latest-linux
          path: benchmarks/results/ci-latest.json

  # Maintainer secrets: Trusted Publishing (OIDC) — docs/SECRETS.md — bun run secrets:doctor
  # Publish when tests pass; do not skip release if the benchmark job fails.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commitlint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package
        run: bun run verify-package

      - name: Release preflight
        run: bun run release:preflight

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
