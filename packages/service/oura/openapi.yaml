    "/oauth/token": {
      "post": {
        "operationId": "OAuthToken",
        "x-mockingbird": {
          "parity": {
            "safe": false
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "required": [
                  "grant_type"
                ],
                "properties": {
                  "grant_type": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  },
                  "refresh_token": {
                    "type": "string"
                  },
                  "client_id": {
                    "type": "string"
                  },
                  "client_secret": {
                    "type": "string"
                  },
                  "redirect_uri": {
                    "type": "string"
                  },
                  "code_verifier": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Token",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "access_token",
                    "refresh_token",
                    "expires_in",
                    "token_type"
                  ],
                  "properties": {
                    "access_token": {
                      "type": "string",
                      "x-mockingbird-volatile": {
                        "kind": "token"
                      }
                    },
                    "refresh_token": {
                      "type": "string",
                      "x-mockingbird-volatile": {
                        "kind": "token"
                      }
                    },
                    "expires_in": {
                      "type": "integer"
                    },
                    "token_type": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "OAuth error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error"
                  ],
                  "properties": {
                    "error": {
                      "type": "string"
                    },
                    "status": {
                      "type": "integer"
                    },
                    "error_description": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/oauth/authorize": {
      "get": {
        "operationId": "OAuthAuthorize",
        "description": "Authorization endpoint (cloud.ouraring.com/oauth/authorize on the live service). The emulator has no consent page: the consent row for the client decides, and the browser is redirected to redirect_uri with code and state, or error and state. An unknown client or unregistered redirect_uri is answered in place, never redirected to.",
        "x-mockingbird": {
          "parity": {
            "safe": false
          }
        },
        "parameters": [
          {
            "name": "response_type",
            "in": "query",
            "description": "Must be `code`.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "client_id",
            "in": "query",
            "description": "The registered client.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "redirect_uri",
            "in": "query",
            "description": "Optional when the client has exactly one registered redirect URI; otherwise must match one exactly.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "scope",
            "in": "query",
            "description": "Space-delimited scopes. Omitted: all scopes.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "state",
            "in": "query",
            "description": "Opaque value, echoed unchanged.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code_challenge",
            "in": "query",
            "description": "Optional PKCE challenge.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code_challenge_method",
            "in": "query",
            "description": "Only `S256`.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to redirect_uri with code and state, or error, error_description and state",
