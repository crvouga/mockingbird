    "/oauth/oauth2/auth": {
      "get": {
        "operationId": "OAuthAuthorize",
        "description": "Authorization endpoint (Ory Hydra on WHOOP). The emulator has no consent page: the consent row for the client decides, and the browser is redirected to redirect_uri with code and state, or error and state. An unknown client or unregistered redirect_uri is answered in place, never redirected to.",
        "x-mockingbird": {
          "parity": {
            "safe": false
          }
        },
        "security": [],
        "parameters": [
          {
            "name": "response_type",
            "in": "query",
            "description": "Must be `code`.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "client_id",
            "in": "query",
            "description": "The registered client.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "redirect_uri",
            "in": "query",
            "description": "Must match a redirect URI registered for the client exactly.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "scope",
            "in": "query",
            "description": "Space-delimited scopes.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "state",
            "in": "query",
            "description": "Opaque CSRF value, echoed unchanged. At least 8 characters.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code_challenge",
            "in": "query",
            "description": "Optional PKCE challenge.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code_challenge_method",
            "in": "query",
            "description": "Only `S256`.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to redirect_uri with code and state, or error, error_description and state",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "redirect_uri missing or not registered, or client_id missing (never redirected)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "401": {
            "description": "Unknown client",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          }
        }
      }
    },
    "/oauth/oauth2/token": {
      "post": {
        "operationId": "OAuthToken",
        "x-mockingbird": {
          "parity": {
            "safe": false
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "required": [
                  "grant_type"
                ],
                "properties": {
                  "grant_type": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  },
                  "refresh_token": {
                    "type": "string"
                  },
                  "client_id": {
                    "type": "string"
                  },
                  "client_secret": {
                    "type": "string"
                  },
                  "redirect_uri": {
                    "type": "string"
                  },
                  "code_verifier": {
                    "type": "string"
                  },
                  "scope": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Token",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "access_token",
                    "expires_in",
                    "token_type",
                    "scope"
                  ],
                  "properties": {
                    "access_token": {
                      "type": "string",
                      "x-mockingbird-volatile": {
                        "kind": "token"
                      }
                    },
                    "refresh_token": {
                      "type": "string",
                      "x-mockingbird-volatile": {
                        "kind": "token"
                      }
                    },
                    "expires_in": {
                      "type": "integer"
                    },
                    "token_type": {
                      "type": "string"
                    },
                    "scope": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
