  "paths": {
    "/developer/v2/activity/workout": {
      "get": {
        "tags": [
          "Workout"
        ],
        "description": "Get all workouts for a user, paginated. Results are sorted by start time in descending order.",
        "operationId": "ListWorkout",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "description": "Limit on the number of workouts returned",
            "schema": {
              "maximum": 25,
              "type": "integer",
              "format": "int32",
              "default": 10
            }
          },
          {
            "name": "start",
            "in": "query",
            "description": "Return workouts that occurred after or during (inclusive) this time. If not specified, the response will not filter workouts by a minimum time.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "end",
            "in": "query",
            "description": "Return workouts that intersect this time or ended before (exclusive) this time. If not specified, `end` will be set to `now`.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "nextToken",
            "in": "query",
            "description": "Optional next token from the previous response to get the next page. If not provided, the first page in the collection is returned",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkoutCollection"
                }
              }
            }
          },
          "400": {
            "description": "Provider error (preset body is a scripted fixture)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "401": {
            "description": "Provider error (preset body is a scripted fixture)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "403": {
            "description": "Provider error (preset body is a scripted fixture)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "429": {
            "description": "Provider error (preset body is a scripted fixture)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "500": {
            "description": "Provider error (preset body is a scripted fixture)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          }
        },
        "security": [
          {
            "OAuth": [
              "read:workout"
            ]
          }
        ],
        "x-mockingbird": {
          "parity": {
            "safe": true
          }
        }
      }
    },
