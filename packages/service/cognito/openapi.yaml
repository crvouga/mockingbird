openapi: 3.1.0
info:
  title: Amazon Cognito Identity Provider (Mockingbird subset)
  version: "2016-04-18"
  description: Hand-trimmed AWS JSON 1.1 user-pools contract used by the AWS SDK clients.
servers:
  - url: https://cognito-idp.us-east-1.amazonaws.com
security:
  - sigv4: []
paths:
  /:
    post:
      operationId: CognitoRpc
      x-mockingbird:
        supported: true
        parity: { enabled: true, safe: false }
      parameters:
        - name: X-Amz-Target
          in: header
          required: true
          schema:
            type: string
            pattern: '^AWSCognitoIdentityProviderService\.[A-Za-z]+$'
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Operation-specific AWS JSON response.
          content:
            application/x-amz-json-1.1:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Cognito service exception.
          content:
            application/x-amz-json-1.1:
              schema:
                type: object
                required: [__type, message]
                properties:
                  __type: { type: string }
                  message: { type: string }
                additionalProperties: true
  /{poolId}/.well-known/openid-configuration:
    get:
      operationId: Discovery
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: Namespace-scoped local issuer metadata with configured public origin/prefix. } }
      parameters:
        - { name: poolId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OIDC discovery.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /{poolId}/.well-known/jwks.json:
    get:
      operationId: Jwks
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: Namespace-scoped RS256 keys; one key signs ID tokens and another signs access tokens as in Cognito; portable snapshots retain the current pair and two prior pairs. } }
      parameters:
        - { name: poolId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: JSON Web Key Set.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /oauth2/authorize:
    get:
      operationId: HostedAuthorize
      summary: Hosted UI authorization endpoint (authorization code grant, optional PKCE S256).
      description: >-
        https://docs.aws.amazon.com/cognito/latest/developerguide/authorization-endpoint.html.
        Renders an account picker of the pool's users in place of the provider's sign-in page,
        or completes at once when POST /__admin/hosted-ui/next-account picked the account.
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: "Best guess from the Cognito docs, not oracle-verified; browser redirect flow with an emulator-rendered account picker." } }
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string } }
        - { name: identity_provider, in: query, required: false, schema: { type: string } }
        - { name: idp_identifier, in: query, required: false, schema: { type: string } }
        - { name: nonce, in: query, required: false, schema: { type: string } }
        - { name: code_challenge, in: query, required: false, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: false, schema: { type: string, enum: [S256] } }
      responses:
        "200":
          description: Account picker.
          content: { text/html: { schema: { type: string } } }
        "302":
          description: >-
            Redirect to redirect_uri with code and state (or error), or to /error with
            redirect_mismatch / invalid_client.
  /oauth2/idpresponse:
    post:
      operationId: HostedIdpResponse
      summary: The account picker's form post; redirects to redirect_uri with code and state.
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: "Emulator-only stand-in for the provider callback; best guess, not oracle-verified." } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                transaction: { type: string }
                username: { type: string }
                action: { type: string, enum: [cancel] }
      responses:
        "302": { description: Redirect to redirect_uri with code and state, or error=access_denied. }
        "400":
          description: Unknown or expired sign-in session, or unknown account.
          content: { text/html: { schema: { type: string } } }
  /oauth2/token:
    options:
      operationId: HostedTokenPreflight
      summary: CORS preflight; the token endpoint answers Access-Control-Allow-Origin *.
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: CORS preflight. } }
      responses:
        "204": { description: CORS preflight. }
    post:
      operationId: HostedToken
      summary: Token endpoint (authorization_code and refresh_token grants).
      description: https://docs.aws.amazon.com/cognito/latest/developerguide/token-endpoint.html
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: "Best guess from the Cognito docs, not oracle-verified; client_credentials is not modelled (unsupported_grant_type)." } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
      responses:
        "200":
          description: Tokens. refresh_token only for authorization_code; id_token when openid was granted.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string, x-mockingbird-volatile: { kind: token } }
                  id_token: { type: string, x-mockingbird-volatile: { kind: token } }
                  refresh_token: { type: string, x-mockingbird-volatile: { kind: token } }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
        "400":
          description: OAuth error.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type]
                  error_description: { type: string }
  /error:
    get:
      operationId: HostedError
      summary: Hosted UI error page (e.g. error=redirect_mismatch).
      security: []
      x-mockingbird: { supported: true, parity: { enabled: false, reason: Static error page. } }
      parameters:
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: client_id, in: query, required: false, schema: { type: string } }
      responses:
        "400":
          description: Error page.
          content: { text/html: { schema: { type: string } } }
components:
  securitySchemes:
    sigv4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS SigV4; fixture signatures are accepted and access-key ids select namespaces.
