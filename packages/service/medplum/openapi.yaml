openapi: 3.1.0
info:
  title: Medplum API (Mockingbird contract)
  description: |
    The surface of a self-hosted Medplum server (v5.1.37) that the mock implements: FHIR R4 REST
    (every resource type, through Medplum's own FHIR router), OAuth2 and the auth API, the project
    admin API, Binary storage and the unauthenticated server endpoints.

    FHIR operations are generic over `{resourceType}`; the Patient paths are the same routes with a
    typed schema, used by the random parity walks. Behaviour is proven against a real self-hosted
    server by the scenario recordings and random differential walks in `scripts/parity.ts`.
  version: "5.1.37"
  x-mockingbird-upstream:
    docs: https://www.medplum.com/docs/api
    selfHosting: https://www.medplum.com/docs/self-hosting/install-from-scratch
    source: https://github.com/medplum/medplum/tree/v5.1.37/packages/server
servers:
  - url: http://localhost:8103
security:
  - bearerAuth: []
  - basicAuth: []
paths:
  /:
    get:
      operationId: GetRoot
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Static server root; covered by the server scenarios." }
      responses:
        "200": { description: OK, content: { text/plain: { schema: { type: string } } } }
  /healthcheck:
    get:
      operationId: GetHealthcheck
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Reports the host (platform, runtime) the server runs on." }
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /robots.txt:
    get:
      operationId: GetRobots
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Static text; covered by the server scenarios." }
      responses:
        "200": { description: robots.txt, content: { text/plain: { schema: { type: string } } } }
  /.well-known/jwks.json:
    get:
      operationId: GetJwks
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Signing keys are generated per server." }
      responses:
        "200": { description: The public keys that verify issued tokens, content: { application/json: { schema: { type: object } } } }
  /.well-known/openid-configuration:
    get:
      operationId: GetOpenIdConfiguration
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Discovery document; endpoints are the server's own." }
      responses:
        "200": { description: OpenID discovery, content: { application/json: { schema: { type: object } } } }
  /.well-known/smart-configuration:
    get:
      operationId: GetSmartConfiguration
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Discovery document; endpoints are the server's own." }
      responses:
        "200": { description: SMART discovery, content: { application/json: { schema: { type: object } } } }
  /auth/login:
    post:
      operationId: PostAuthLogin
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Password flows are covered by the auth scenarios." }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200": { description: A login code (or the memberships to choose from), content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "400": { description: Invalid credentials or request, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "404": { description: Unknown client, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /auth/profile:
    post:
      operationId: PostAuthProfile
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Multi-membership login step." }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { login: { type: string }, profile: { type: string } } } } }
      responses:
        "200": { description: A login code, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "400": { description: Invalid login or profile, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /auth/me:
    get:
      operationId: GetAuthMe
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the auth and admin scenarios." }
      responses:
        "200": { description: The caller's user, project, membership, profile and access policy, content: { application/json: { schema: { type: object } } } }
        "401": { description: Unauthenticated, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /oauth2/token:
    post:
      operationId: PostOauth2Token
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Tokens are minted per call; covered by the auth scenarios." }
      requestBody:
        required: true
        content: { application/x-www-form-urlencoded: { schema: { $ref: "#/components/schemas/TokenRequest" } } }
      responses:
        "200": { description: Tokens, content: { application/json: { schema: { $ref: "#/components/schemas/TokenResponse" } } } }
        "400": { description: OAuth error, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthError" } } } }
  /oauth2/userinfo:
    get:
      operationId: GetOauth2UserInfo
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the auth scenarios." }
      responses:
        "200": { description: OpenID claims, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: PostOauth2UserInfo
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the auth scenarios." }
      responses:
        "200": { description: OpenID claims, content: { application/json: { schema: { type: object } } } }
  /oauth2/logout:
    get:
      operationId: GetOauth2Logout
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Revokes the caller's login." }
      responses:
        "200": { description: Logged out, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    post:
      operationId: PostOauth2Logout
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Revokes the caller's login." }
      responses:
        "200": { description: Logged out, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /admin/projects/{projectId}:
    get:
      operationId: GetAdminProject
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Project admins only; covered by the admin scenarios." }
      parameters: [{ $ref: "#/components/parameters/projectId" }]
      responses:
        "200": { description: The caller's project, content: { application/json: { schema: { type: object } } } }
        "403": { description: Not a project admin, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /admin/projects/{projectId}/client:
    post:
      operationId: PostAdminProjectClient
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Creates credentials; covered by the admin scenarios." }
      parameters: [{ $ref: "#/components/parameters/projectId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } }
      responses:
        "201": { description: The ClientApplication (with its secret), content: { application/json: { schema: { type: object } } } }
        "400": { description: Invalid request, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "403": { description: Not a project admin, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /admin/projects/{projectId}/invite:
    post:
      operationId: PostAdminProjectInvite
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Creates users; covered by the admin scenarios." }
      parameters: [{ $ref: "#/components/parameters/projectId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InviteRequest" } } }
      responses:
        "200": { description: The new ProjectMembership, content: { application/fhir+json: { schema: { type: object } } } }
        "400": { description: Invalid request, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "403": { description: Not a project admin, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "409": { description: Already a member, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /admin/projects/{projectId}/settings:
    post:
      operationId: PostAdminProjectSettings
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Rewrites the caller's project." }
      parameters: [{ $ref: "#/components/parameters/projectId" }]
      responses:
        "200": { description: The updated Project, content: { application/json: { schema: { type: object } } } }
  /admin/projects/{projectId}/secrets:
    post:
      operationId: PostAdminProjectSecrets
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Rewrites the caller's project." }
      parameters: [{ $ref: "#/components/parameters/projectId" }]
      responses:
        "200": { description: The updated Project, content: { application/json: { schema: { type: object } } } }
  /admin/projects/{projectId}/sites:
    post:
      operationId: PostAdminProjectSites
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Rewrites the caller's project." }
      parameters: [{ $ref: "#/components/parameters/projectId" }]
      responses:
        "200": { description: The updated Project, content: { application/json: { schema: { type: object } } } }
  /admin/projects/{projectId}/members/{membershipId}:
    get:
      operationId: GetAdminProjectMember
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the admin scenarios." }
      parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/membershipId" }]
      responses:
        "200": { description: The ProjectMembership, content: { application/json: { schema: { type: object } } } }
        "403": { description: Not in the caller's project, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    post:
      operationId: PostAdminProjectMember
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Rewrites a membership." }
      parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/membershipId" }]
      responses:
        "200": { description: The updated ProjectMembership, content: { application/json: { schema: { type: object } } } }
    delete:
      operationId: DeleteAdminProjectMember
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Removes a member (and a project-scoped user)." }
      parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/membershipId" }]
      responses:
        "200": { description: Removed, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /storage/{binaryId}/{versionId}:
    get:
      operationId: GetStorageBinary
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Presigned URLs carry a per-server signature; covered by the binary scenario." }
      parameters:
        - { name: binaryId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The Binary content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { description: Missing or invalid signature, content: { text/plain: { schema: { type: string } } } }
        "410": { description: Expired URL, content: { text/html: { schema: { type: string } } } }
  /fhir/R4:
    get:
      operationId: FhirSearchSystem
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the search scenarios." }
      responses:
        "200": { description: Searchset across `_type`, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
        "400": { description: Bad search, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    post:
      operationId: FhirBatch
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the batch and transaction scenarios." }
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } }
      responses:
        "200": { description: batch-response or transaction-response Bundle, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
        "400": { description: Not a batch or transaction, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/metadata:
    get:
      operationId: FhirCapabilities
      security: []
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the auth scenarios (compared in full)." }
      responses:
        "200": { description: CapabilityStatement, content: { application/json: { schema: { type: object } } } }
  /fhir/R4/$graphql:
    post:
      operationId: FhirGraphql
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the graphql scenario." }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { query: { type: string } } } } }
      responses:
        "200": { description: GraphQL result, content: { application/json: { schema: { type: object } } } }
        "400": { description: Invalid query, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/Binary:
    post:
      operationId: FhirBinaryUpload
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the binary scenario." }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "201": { description: The Binary, with a presigned `url`, content: { application/fhir+json: { schema: { type: object } } } }
  /fhir/R4/Binary/{id}:
    get:
      operationId: FhirBinaryRead
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the binary scenario." }
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Raw content, or the Binary with `Accept: application/fhir+json`, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    put:
      operationId: FhirBinaryReplace
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the binary scenario." }
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "200": { description: The Binary, with a presigned `url`, content: { application/fhir+json: { schema: { type: object } } } }
  /fhir/R4/Patient:
    get:
      operationId: SearchPatient
      x-mockingbird:
        supported: true
        parity: { enabled: true, safe: true }
      parameters:
        - { name: name, in: query, required: false, schema: { type: string, enum: [ada, lovelace, turing, zola, gra] } }
        - { name: gender, in: query, required: false, schema: { type: string, enum: [male, female, other, unknown] } }
        - { name: birthdate, in: query, required: false, schema: { type: string, enum: [ge1900-01-01, lt1950-06-01, "1815-12-10"] } }
        - { name: _count, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: _sort, in: query, required: false, schema: { type: string, enum: [birthdate, -birthdate, family] } }
      responses:
        "200": { description: Searchset, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/PatientBundle" } } } }
        "400": { description: Bad search, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    post:
      operationId: CreatePatient
      x-mockingbird:
        supported: true
        parity: { enabled: true, safe: true }
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/PatientInput" } } }
      responses:
        "201": { description: Created, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "400": { description: Invalid resource, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/Patient/{id}:
    get:
      operationId: ReadPatient
      x-mockingbird:
        supported: true
        parity: { enabled: true, safe: true }
      parameters: [{ $ref: "#/components/parameters/patientId" }]
      responses:
        "200": { description: The Patient, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "410": { description: Deleted, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    put:
      operationId: UpdatePatient
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "The body must carry the id from the path; covered by the random differential walks." }
      parameters: [{ $ref: "#/components/parameters/patientId" }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/PatientInput" } } }
      responses:
        "200": { description: Updated, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "400": { description: Invalid resource, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    delete:
      operationId: DeletePatient
      x-mockingbird:
        supported: true
        parity: { enabled: true, safe: true }
      parameters: [{ $ref: "#/components/parameters/patientId" }]
      responses:
        "200": { description: Deleted (or already deleted), content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/Patient/{id}/_history:
    get:
      operationId: ReadPatientHistory
      x-mockingbird:
        supported: true
        parity: { enabled: true, safe: true }
      parameters: [{ $ref: "#/components/parameters/patientId" }]
      responses:
        "200": { description: History Bundle, newest first, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/Patient/{id}/$everything:
    get:
      operationId: PatientEverything
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the resource variety scenario." }
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: The patient compartment, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/{resourceType}:
    get:
      operationId: FhirSearch
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Every resource type; covered by the search scenarios and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      responses:
        "200": { description: Searchset, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
        "400": { description: Bad search, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "403": { description: Not permitted, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    post:
      operationId: FhirCreate
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Every resource type; covered by the scenarios and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } }
      responses:
        "200": { description: Conditional create matched an existing resource, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "201": { description: Created, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "400": { description: Invalid resource, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "412": { description: Conditional create matched several, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    put:
      operationId: FhirConditionalUpdate
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the conditional scenario." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } }
      responses:
        "200": { description: Updated, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "201": { description: Created, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "412": { description: Matched several, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    patch:
      operationId: FhirConditionalPatch
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the conditional scenario." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      requestBody:
        required: true
        content: { application/json-patch+json: { schema: { type: array, items: { type: object } } } }
      responses:
        "200": { description: Patched, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "404": { description: Nothing matched, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    delete:
      operationId: FhirConditionalDelete
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the conditional scenario." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      responses:
        "200": { description: Deleted (or nothing matched), content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "412": { description: Matched several, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/{resourceType}/_search:
    post:
      operationId: FhirSearchPost
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the search scenarios." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      requestBody:
        required: true
        content: { application/x-www-form-urlencoded: { schema: { type: object } } }
      responses:
        "200": { description: Searchset, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
  /fhir/R4/{resourceType}/$validate:
    post:
      operationId: FhirValidate
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the server scenarios." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } }
      responses:
        "200": { description: Valid, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "400": { description: Invalid, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/{resourceType}/{id}:
    get:
      operationId: FhirRead
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Every resource type; covered by the scenarios and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: The resource, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "404": { description: Not found, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "410": { description: Deleted, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    put:
      operationId: FhirUpdate
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the scenarios and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }, { $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } }
      responses:
        "200": { description: Updated, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "400": { description: Invalid, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "412": { description: If-Match mismatch, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    patch:
      operationId: FhirPatch
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the patch scenario and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }, { $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content: { application/json-patch+json: { schema: { type: array, items: { type: object } } } }
      responses:
        "200": { description: Patched, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "400": { description: Invalid patch, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
    delete:
      operationId: FhirDelete
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Covered by the scenarios and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Deleted, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/{resourceType}/{id}/_history:
    get:
      operationId: FhirHistory
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the scenarios and random walks." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: History Bundle, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Bundle" } } } }
  /fhir/R4/{resourceType}/{id}/_history/{versionId}:
    get:
      operationId: FhirVersionRead
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: true, reason: "Covered by the CRUD scenarios." }
      parameters:
        - { $ref: "#/components/parameters/resourceType" }
        - { $ref: "#/components/parameters/id" }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: That version, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/Resource" } } } }
        "410": { description: A delete version, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
  /fhir/R4/{resourceType}/{id}/$expunge:
    post:
      operationId: FhirExpunge
      x-mockingbird:
        supported: true
        parity: { enabled: false, safe: false, reason: "Super admin only; erases history." }
      parameters: [{ $ref: "#/components/parameters/resourceType" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Expunged, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "403": { description: Not a super admin, content: { application/fhir+json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    basicAuth: { type: http, scheme: basic, description: "ClientApplication id and secret" }
  parameters:
    projectId: { name: projectId, in: path, required: true, schema: { type: string } }
    membershipId: { name: membershipId, in: path, required: true, schema: { type: string } }
    resourceType: { name: resourceType, in: path, required: true, schema: { type: string } }
    id: { name: id, in: path, required: true, schema: { type: string } }
    patientId:
      name: id
      in: path
      required: true
      schema:
        type: string
        x-mockingbird-resource-ref: { type: patient, missing: not_found }
  schemas:
    HealthStatus:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        version: { type: string }
        postgres: { type: boolean }
        redis: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        clientId: { type: string }
        projectId: { type: string }
        scope: { type: string }
        codeChallenge: { type: string }
        codeChallengeMethod: { type: string, enum: [plain, S256] }
    LoginResponse:
      type: object
      required: [login]
      properties:
        login: { type: string }
        code: { type: string, x-mockingbird-volatile: { kind: token } }
        memberships: { type: array, items: { type: object } }
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [client_credentials, authorization_code, refresh_token] }
        client_id: { type: string }
        client_secret: { type: string }
        code: { type: string }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope: { type: string }
    TokenResponse:
      type: object
      required: [token_type, expires_in, access_token]
      properties:
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        scope: { type: string }
        access_token: { type: string, x-mockingbird-volatile: { kind: token } }
        id_token: { type: string, x-mockingbird-volatile: { kind: token } }
        refresh_token: { type: string, x-mockingbird-volatile: { kind: token } }
        project: { type: object }
        profile: { type: object }
    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
    InviteRequest:
      type: object
      required: [resourceType, firstName, lastName]
      properties:
        resourceType: { type: string, enum: [Patient, Practitioner, RelatedPerson] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        externalId: { type: string }
        password: { type: string }
        scope: { type: string, enum: [project, server] }
        admin: { type: boolean }
        sendEmail: { type: boolean }
    Resource:
      type: object
      required: [resourceType]
      properties:
        resourceType: { type: string }
        id: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
      additionalProperties: true
    Meta:
      type: object
      properties:
        versionId: { type: string, x-mockingbird-volatile: { kind: id } }
        lastUpdated: { type: string, format: date-time, x-mockingbird-volatile: { kind: timestamp } }
    HumanName:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        family: { type: string, enum: [Lovelace, Turing, Zola, Hopper] }
        given: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [Ada, Alan, Grace, Emile] } }
    PatientInput:
      type: object
      required: [resourceType]
      additionalProperties: false
      properties:
        resourceType: { type: string, enum: [Patient] }
        active: { type: boolean }
        gender: { type: string, enum: [male, female, other, unknown] }
        birthDate: { type: string, enum: ["1815-12-10", "1912-06-23", "1906-12-09", "1950-01-01"] }
        name: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/HumanName" } }
    Patient:
      type: object
      required: [resourceType, id, meta]
      properties:
        resourceType: { type: string, enum: [Patient] }
        id:
          type: string
          x-mockingbird-resource: { type: patient, identity: true }
        meta: { $ref: "#/components/schemas/Meta" }
        active: { type: boolean }
        gender: { type: string }
        birthDate: { type: string }
        # The server strips empty values, so an emptied name array slot serializes as null.
        name: { type: array, items: { anyOf: [{ $ref: "#/components/schemas/HumanName" }, { type: "null" }] } }
    PatientBundle:
      type: object
      required: [resourceType, type]
      properties:
        resourceType: { type: string, enum: [Bundle] }
        type: { type: string, enum: [searchset] }
        total: { type: integer }
        entry:
          type: array
          items:
            type: object
            properties:
              fullUrl: { type: string }
              search: { type: object }
              resource: { $ref: "#/components/schemas/Patient" }
        link: { type: array, items: { type: object } }
    Bundle:
      type: object
      required: [resourceType, type]
      properties:
        resourceType: { type: string, enum: [Bundle] }
        type: { type: string }
        total: { type: integer }
        entry: { type: array, items: { type: object } }
        link: { type: array, items: { type: object } }
    OperationOutcome:
      type: object
      required: [resourceType, issue]
      properties:
        resourceType: { type: string, enum: [OperationOutcome] }
        id: { type: string }
        issue: { type: array, items: { type: object } }
        extension: { type: array, items: { type: object } }
