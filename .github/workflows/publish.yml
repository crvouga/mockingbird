# Managed by OpenTofu github_repository_file.
name: Publish image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  mockingbird_docs:
    uses: crvouga/personal/.github/workflows/publish.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: mockingbird-docs
      dockerfile: sites/docs/Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/personal

  mockingbird_fleet:
    uses: crvouga/personal/.github/workflows/publish.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: mockingbird-fleet
      dockerfile: sites/fleet/Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/personal
