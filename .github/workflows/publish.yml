# Managed by OpenTofu github_repository_file.
name: Publish image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read

jobs:
  mockingbird_docs:
    uses: crvouga/workspace/.github/workflows/ci.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: mockingbird-docs
      dockerfile: sites/docs/Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/workspace

  mockingbird_fleet:
    uses: crvouga/workspace/.github/workflows/ci.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: mockingbird-fleet
      dockerfile: sites/fleet/Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/workspace
