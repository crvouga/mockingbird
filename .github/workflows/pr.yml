# Pull-request gate. A green run of this workflow is the release decision:
# merging to main publishes (see ci.yml). Do not add a second quality bar there.
#
# Required status checks on main (scripts/pr-ready.ts REQUIRED_CHECKS): Commitlint, and Check,
# which passes only when every job it needs passed or was not needed. The jobs in between (Static,
# Shard i, Consumer smoke) can be renamed or split freely; rename Commitlint or Check and update that
# list in the same change. GitGuardian Security Checks is the other required check; it is reported
# by the GitGuardian app, not by a job in this file.
#
# Together the Static and Shard jobs run exactly `bun run check` (scripts/ci-plan.ts splits it and
# fails on drift), spread over parallel runners. Changes decides what a change needs from
# Turborepo's dependency graph: the Shard jobs run only the packages a change reaches (each changed
# package and everything that depends on it), and skip entirely when it reaches none; turbo's
# content hashes then replay what did not change inside those. Non-blocking checks (live parity,
# lint annotations) live in advisory.yml.
#
# It also runs on every push to main. That is what keeps main's turbo cache warm per job, so a PR's
# first run replays everything it did not touch (see .github/actions/setup). Those runs are never
# cancelled; PR runs are superseded by the next push.
#
# Local replica: bun run check:full
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      smoke: ${{ steps.plan.outputs.smoke }}
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      # A pull_request checkout is the merge commit, so HEAD^1 is the base it will land on.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - id: plan
        run: bun scripts/ci-plan.ts changes ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '--all' }}

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      # Merge commits land on main, and each PR commit drives the release bump.
      - name: Validate PR commits
        run: |
          git rev-list --first-parent --reverse \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} |
          while read -r commit; do
            git show --no-patch --format=%B "$commit" | bunx commitlint --verbose
          done

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: .+
          subjectPatternError: |
            The PR title "{title}" looks empty after the type/scope prefix.
            Use a Conventional Commits title, e.g. "feat: add junction emulator".

  # Root checks include the bounded SQL performance suite; its upstream builds run through turbo.
  # The static job still starts independently of Changes.
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          turbo-cache: static

      - name: Format, lint, boundaries, agents, worktree, llms.txt, README, brands, scripts, workflows
        run: bun scripts/ci-plan.ts static --output-logs=errors-only --continue=dependencies-successful

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-performance
          path: .performance/
          retention-days: 14
          if-no-files-found: ignore

      - if: always()
        uses: ./.github/actions/turbo-cache-save
        with:
          scope: static

  shard:
    name: Shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every shard finishes and saves its cache, so a retry replays what already passed.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      FC_NUM_RUNS: "40"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build, typecheck, test, pack, portability (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        timeout-minutes: 20
        env:
          AFFECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        # Each task can spawn compilers or SDK workers. Turbo's default of ten concurrent
        # tasks starves multipart uploads on hosted runners; keep every check, bound the load.
        run: >-
          bun scripts/ci-plan.ts shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --concurrency=2 --output-logs=errors-only --continue=dependencies-successful

      - if: always()
        uses: ./.github/actions/turbo-cache-save
        with:
          scope: shard-${{ matrix.shard }}

  # Pack every public package like the release does and install it into a clean npm project. Runs
  # beside the shards rather than after them: it builds from the same caches, so waiting would only
  # add their duration to its own.
  smoke:
    name: Consumer smoke
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build
        timeout-minutes: 12
        run: bunx turbo run build --output-logs=errors-only

      # The smoke is a pure function of the tarballs it installs: a fingerprint that already passed
      # (on main or an earlier run of this PR) is not re-checked. Only the empty stamp is cached.
      - id: smoke-key
        run: echo "key=smoke-v1-${{ runner.os }}-$(bun scripts/ci-plan.ts smoke-key)" >> "$GITHUB_OUTPUT"

      - id: smoke-stamp
        uses: actions/cache/restore@v5
        with:
          path: .smoke-passed
          key: ${{ steps.smoke-key.outputs.key }}
          lookup-only: true

      - name: Consumer smoke (npm install + import + typecheck every published entry point)
        if: steps.smoke-stamp.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: bun run release:smoke && mkdir -p .smoke-passed && touch .smoke-passed/ok

      - if: steps.smoke-stamp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .smoke-passed
          key: ${{ steps.smoke-key.outputs.key }}

  fleet-container:
    name: Fleet container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build pinned reference image
        run: docker build --platform linux/${{ matrix.arch }} -f packages/examples/fleet-reference/Dockerfile -t mockingbird-fleet:smoke .
      - name: Verify non-root mixed-protocol fresh-process recovery
        run: bun run --cwd packages/examples/fleet-reference smoke

  check:
    name: Check
    if: always()
    needs: [changes, static, shard, smoke, fleet-container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this change needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            def ran_or_not_needed($job; $needed):
              .[$job].result == "success"
              or (.[$job].result == "skipped" and .changes.outputs[$needed] == "false");
            .changes.result == "success"
            and .static.result == "success"
            and .["fleet-container"].result == "success"
            and ran_or_not_needed("shard"; "shards")
            and ran_or_not_needed("smoke"; "smoke")
          ' > /dev/null
