# Pull-request gate. Deliberately small, so a pull request merges in about a minute: the commit
# messages (they decide the release bump) and Biome's format and lint. Nothing else runs on a pull
# request.
#
# Everything slower (build, typecheck, tests, pack, portability, the root checks, the consumer
# smoke, the fleet container, npm names, live parity) runs after the merge, as the release checks in
# ci.yml. Those hold the publish, not the merge, and a failing one opens a GitHub issue. Add a slow
# check there, not here.
#
# Required status checks on main (scripts/pr-ready.ts REQUIRED_CHECKS): Commitlint, and Check,
# which passes only when every job it needs passed. Lint can be renamed or split freely; rename
# Commitlint or Check and update that list in the same change.
#
# Local replica of everything, release checks included: bun run check:full
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      # Merge commits land on main, and each PR commit drives the release bump.
      - name: Validate PR commits
        run: |
          git rev-list --first-parent --reverse \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} |
          while read -r commit; do
            git show --no-patch --format=%B "$commit" | bunx commitlint --verbose
          done

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: .+
          subjectPatternError: |
            The PR title "{title}" looks empty after the type/scope prefix.
            Use a Conventional Commits title, e.g. "feat: add junction emulator".

  # Biome over the whole repository: format and lint, reported as inline annotations on the diff.
  # No build and no turbo, so it needs only node_modules from the cache.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - run: bunx biome ci --reporter=github .

  check:
    name: Check
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this change needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
