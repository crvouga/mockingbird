# Differential verification of the Junction emulator against the real Junction sandbox:
# `mockingbird-junction verify` replays a runner-local corpus and a stateful scenario
# (users, catalog, serviceability, orders) against both and fails on any divergence.
#
# Manual dispatch only: the team's Junction sandbox trial has lapsed (it answers HTTP 402
# Payment Required), so the daily schedule is off until access is restored. Restore the
# `schedule:` trigger (cron "17 9 * * *") then.
#
# Not a required check — it depends on a live vendor. The sandbox key is the
# JUNCTION_API_KEY repo secret (docs/SECRETS.md). The scenario deletes the
# user it creates and cancels its order, because it shares the capped sandbox team with
# everything else.
name: Verify

on:
  workflow_dispatch:

concurrency:
  group: verify-junction
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  junction:
    name: Junction sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The verifier runs from source, but its workspace imports resolve to dist.
      # Restore the same build caches as CI and build its dependencies first.
      - uses: ./.github/actions/setup

      - name: Build verifier dependencies
        timeout-minutes: 10
        run: bunx turbo run build --filter='@crvouga/mockingbird-service-junction^...' --output-logs=errors-only

      - name: Verify against the current sandbox using an ephemeral corpus
        timeout-minutes: 20
        env:
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
        run: |
          corpus="$RUNNER_TEMP/junction-corpus.json"
          report="$RUNNER_TEMP/junction-response.json"
          trap 'rm -f "$corpus" "$report"' EXIT
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "x-vital-api-key: $JUNCTION_API_KEY" https://api.sandbox.tryvital.io/v3/lab_test)
          case "$status" in
            401|402|403)
              jq -n --argjson status "$status" '{ok: false, blocked: {status: $status}}' > "$RUNNER_TEMP/junction-verify.json"
              echo "::error::Junction denied verification (HTTP $status)"
              exit 1 ;;
            200) ;;
            *) echo "::error::Junction catalog returned HTTP $status"; exit 1 ;;
          esac
          bun run --cwd packages/service/junction corpus:record -- --out "$corpus"
          result=0
          bun run --cwd packages/service/junction verify -- --corpus "$corpus" --sample 60 --orders --json > "$report" || result=$?
          jq '{ok, drift: (.drift | {checked, stale}), scenario: (.scenario | {steps, divergent})} +
            (if .blocked then {blocked: {status: .blocked.status}} else {} end)' \
            "$report" > "$RUNNER_TEMP/junction-verify.json"
          exit "$result"

      - name: Upload verification counts and access status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junction-verify-report
          path: ${{ runner.temp }}/junction-verify.json
          if-no-files-found: ignore
