# Differential verification of the Junction mock against the real Junction sandbox:
# `mockingbird-junction verify` replays the shipped corpus (drift) and a stateful scenario
# (users, catalog, serviceability, orders) against both and fails on any divergence.
#
# Not a required check — it depends on a live vendor. The sandbox key comes from Vault via
# GitHub OIDC (role github-actions), the same way .github/actions/setup loads TURBO_*; no
# stored token. The scenario deletes the user it creates and cancels its order, because it
# shares the capped sandbox team with everything else.
name: Verify

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:

concurrency:
  group: verify-junction
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Vault OIDC → MOCKINGBIRD_JUNCTION_API_KEY

env:
  HUSKY: "0"

jobs:
  junction:
    name: Junction sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          remote-cache: "false"

      - uses: hashicorp/vault-action@v4
        with:
          url: https://vault.chrisvouga.dev
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: https://vault.chrisvouga.dev
          secrets: |
            secret/data/personal/prd MOCKINGBIRD_JUNCTION_API_KEY | MOCKINGBIRD_JUNCTION_API_KEY

      - name: mockingbird-junction verify (shipped corpus, with orders)
        run: bun run --cwd packages/service/junction verify -- --sample 60 --orders
