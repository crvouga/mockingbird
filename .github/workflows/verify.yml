# Differential verification of the Junction emulator against the real Junction sandbox:
# `mockingbird-junction verify` replays the shipped corpus (drift) and a stateful scenario
# (users, catalog, serviceability, orders) against both and fails on any divergence.
#
# Not a required check — it depends on a live vendor. The sandbox key is the
# JUNCTION_API_KEY repo secret (docs/SECRETS.md). The scenario deletes the
# user it creates and cancels its order, because it shares the capped sandbox team with
# everything else.
name: Verify

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:
    inputs:
      refresh_corpus:
        description: "Re-record the sandbox corpus and upload it for review and commit"
        type: boolean
        default: false

concurrency:
  group: verify-junction
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  junction:
    name: Junction sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The verifier runs from source, but its workspace imports resolve to dist.
      # Restore the same build caches as CI and build its dependencies first.
      - uses: ./.github/actions/setup

      - name: Build verifier dependencies
        timeout-minutes: 10
        run: bunx turbo run build --filter='@crvouga/mockingbird-service-junction^...' --output-logs=errors-only

      # Manual maintenance only: scheduled verification always checks the committed corpus.
      - name: Refresh sandbox corpus
        id: refresh
        if: inputs.refresh_corpus == true
        env:
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
        run: bun run --cwd packages/service/junction corpus:record -- --force

      - name: mockingbird-junction verify (shipped corpus, with orders)
        timeout-minutes: 15
        env:
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
        run: |
          set +e
          bun run --cwd packages/service/junction verify -- --sample 60 --orders --json > "$RUNNER_TEMP/junction-verify.json"
          result=$?
          set -e
          # JavaScript template literals are evaluated by Bun.
          # shellcheck disable=SC2016
          bun -e '
            const report = await Bun.file(process.argv[1]).json();
            if (report.blocked) console.error(`::error::${report.blocked.message}`);
            else if (!report.ok) console.error(`::error::Junction verification failed: ${report.drift.stale} stale observations; ${report.scenario.divergent} divergent scenario steps. See junction-verify-report.`);
          ' "$RUNNER_TEMP/junction-verify.json"
          exit "$result"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junction-verify-report
          path: ${{ runner.temp }}/junction-verify.json
          if-no-files-found: ignore

      - name: Upload refreshed corpus
        if: always() && steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: junction-corpus
          path: packages/service/junction/corpus/sandbox-sealed.json
          if-no-files-found: error
