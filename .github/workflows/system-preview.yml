name: System preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: system-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build static system
        if: github.event.action != 'closed'
        run: bunx turbo run preview:build --filter=@crvouga/mockingbird-example-medical-testing
      - uses: actions/upload-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: lab-system-preview
          path: packages/examples/medical-testing/preview-dist
          if-no-files-found: error
      # Forks receive the static artifact, never credentials.
      - name: Publish or remove PR Worker
        id: deploy
        shell: bash
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: packages/examples/medical-testing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PREVIEW_VERSION: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          # Dev resources (docs/DEV_RESOURCES.md): the Worker's /__dev proxy attaches these to
          # same-origin requests the preview forwards to a real non-production resource, and only
          # values that match the allow-list in src/worker.ts. They never reach the browser.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_ACCESS_TOKEN: ${{ secrets.FCM_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Optional, read-only (Actions + Pull requests: read). Without it the live status calls
          # the GitHub API unauthenticated, which is rate limited; updates still work without it.
          PREVIEW_GITHUB_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Hosting needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. The static preview is available as an artifact."
            exit 0
          fi
          if [ "$PR_ACTION" = "closed" ]; then
            # Delete only the script. `wrangler delete` also lists the account's KV namespaces,
            # which this deploy-scoped token cannot read. A Worker that is already gone is fine.
            STATUS=$(curl --silent --show-error -o "$RUNNER_TEMP/worker-delete.json" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mockingbird-lab-pr-$PR_NUMBER?force=true")
            case "$STATUS" in
              200|404) echo "Removed mockingbird-lab-pr-$PR_NUMBER (HTTP $STATUS)" ;;
              *) cat "$RUNNER_TEMP/worker-delete.json"; exit 1 ;;
            esac
          else
            # version.json names this commit; open tabs update to it without reloading.
            PREVIEW_PR="$PR_NUMBER" bun scripts/stamp-version.ts
            # The live status function reads this PR's CI from the GitHub API (stateless).
            deploy() {
              bunx wrangler@4.50.0 deploy --name "mockingbird-lab-pr-$PR_NUMBER" \
                --var "PREVIEW_PR:$PR_NUMBER" --var "PREVIEW_REPOSITORY:$GITHUB_REPOSITORY" \
                > "$RUNNER_TEMP/worker-deploy.log" 2>&1
            }
            if ! deploy; then
              # A preview first deployed with the old Durable Object status cannot drop that class
              # in place. The preview holds no state worth keeping: remove it and deploy fresh.
              if grep -qi "durable object" "$RUNNER_TEMP/worker-deploy.log"; then
                curl --silent --show-error -o /dev/null -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mockingbird-lab-pr-$PR_NUMBER?force=true"
                deploy || { cat "$RUNNER_TEMP/worker-deploy.log"; exit 1; }
              else
                cat "$RUNNER_TEMP/worker-deploy.log"
                exit 1
              fi
            fi
            cat "$RUNNER_TEMP/worker-deploy.log"
            # Only names with a value are sent; values go through a 0600 file that is removed at once.
            SECRETS_FILE="$RUNNER_TEMP/dev-secrets.json"
            ( umask 077; jq -n 'env | with_entries(select(.key | test("^(PREVIEW_GITHUB_TOKEN|STRIPE_SECRET_KEY|JUNCTION_API_KEY|RESEND_API_KEY|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|FCM_PROJECT_ID|FCM_ACCESS_TOKEN|SLACK_BOT_TOKEN)$")) | select(.value != ""))' > "$SECRETS_FILE" )
            echo "Dev resource secrets for this preview: $(jq -r 'keys | join(", ")' "$SECRETS_FILE")"
            if [ "$(jq length "$SECRETS_FILE")" -gt 0 ]; then
              bunx wrangler@4.50.0 secret bulk "$SECRETS_FILE" --name "mockingbird-lab-pr-$PR_NUMBER" > /dev/null
            fi
            rm -f "$SECRETS_FILE"
            PREVIEW_URL=$(grep -Eo "https://mockingbird-lab-pr-${PR_NUMBER}\.[a-z0-9-]+\.workers\.dev" "$RUNNER_TEMP/worker-deploy.log" | tail -1)
            test -n "$PREVIEW_URL"
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$PREVIEW_URL/" -o "$RUNNER_TEMP/preview.html"
            grep -q 'id="system"' "$RUNNER_TEMP/preview.html"
            echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            echo "[Open system preview]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Put preview links at the top of the PR
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const start = '<!-- system-preview:start -->';
            const end = '<!-- system-preview:end -->';
            const url = process.env.PREVIEW_URL;
            const links = `[Preview](${url}/?surface=app)`;
            const body = (pr.body || '').replace(/<!-- system-preview:start -->[\s\S]*?<!-- system-preview:end -->\s*/g, '').trimStart();
            const next = `${start}\n${links}\n${end}\n\n${body}`;
            if (pr.body !== next) {
              await github.rest.pulls.update({ owner, repo, pull_number, body: next });
            }
