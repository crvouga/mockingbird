name: System preview

# The lab's live PR preview, through the reusable workflow every project uses
# (.github/workflows/preview.yml, docs/PREVIEWS.md). It needs only CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; the dev resource credentials below are optional.

# No `workflow_run` of CI any more: relaying CI status into the preview ran this workflow twice per
# CI run. The preview still deploys per push and is deleted on close.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Drafts get no preview; closing always runs so a deployed Worker is deleted.
    if: github.event.action == 'closed' || github.event.pull_request.draft == false
    uses: ./.github/workflows/preview.yml
    with:
      name: mockingbird-lab
      working-directory: packages/examples/medical-testing
      build: bunx turbo run preview:build --filter=@crvouga/mockingbird-example-medical-testing
      outdir: preview-dist
      # Inside this monorepo the CLI is the workspace package's build (made by the build above);
      # other projects use the default, `bunx mockingbird-preview`.
      cli: bun ../../adapters/preview/dist/cli.js
      # The lab's own Worker: the package's preview Worker plus the dev resources proxy.
      wrangler-config: wrangler.jsonc
      # The lab app is the surface the PR link opens.
      link-path: /?surface=app
    # Only these reach the preview workflow; the dev resource credentials are optional.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SECRETS: |
        STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
        JUNCTION_API_KEY=${{ secrets.JUNCTION_API_KEY }}
        RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
        TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
        FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
        FCM_ACCESS_TOKEN=${{ secrets.FCM_ACCESS_TOKEN }}
        SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
