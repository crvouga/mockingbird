# Publish. npm Trusted Publishing is pinned to this filename — keep it `ci.yml`.
#
# This workflow does not decide whether a commit is releasable. A pull request
# whose checks passed (pr.yml: Commitlint, Check, plus GitGuardian) is releasable
# by definition; merging it to main is what starts a publish. Each job builds
# (replaying the turbo caches pr.yml keeps warm on main; it saves none of its own)
# and publishes. It does not re-run those checks.
#
# Schedule and manual dispatch only retry an interrupted publish. They are not
# a second gate.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  release:
    name: Release prerequisites
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Plan
        id: plan
        run: bun run release:plan -- --github-output --save release-plan.json

      # Freeze versions before any job pushes a tag. Shards never recompute the plan.
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json
          retention-days: 1
          if-no-files-found: error

      # Publish anything another release pins (currently SQLite) before the leaf shards.
      - uses: ./.github/actions/release
        if: steps.plan.outputs.has_changes == 'true'
        with:
          group: prerequisites

  publish:
    name: Release shard ${{ matrix.shard }}
    needs: release
    # A failed prerequisite must not stop independent packages. Every pin is checked on npm
    # before publishing; packages whose dependency failed remain blocked.
    if: >-
      ${{ !cancelled() && needs.release.outputs.matrix != '' &&
          needs.release.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v5
        with:
          name: release-plan
      - uses: ./.github/actions/release
        with:
          group: ${{ matrix.shard }}

  reconcile:
    name: Reconcile releases
    needs: [release, publish]
    # Repairs run even when there is nothing new to publish or one shard failed.
    if: ${{ !cancelled() && needs.release.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - uses: actions/download-artifact@v5
        with:
          name: release-plan
      - uses: ./.github/actions/release
        with:
          group: maintenance
