# Publish. npm Trusted Publishing is pinned to this filename — keep it `ci.yml`.
#
# This workflow does not decide whether a commit is releasable. A pull request
# whose checks passed (pr.yml: Commitlint, Check, plus GitGuardian) is releasable
# by definition; merging it to main is what starts a publish. The job builds from
# the Turborepo cache the PR already filled and publishes. It does not re-run
# those checks.
#
# Schedule and manual dispatch only retry an interrupted publish. They are not
# a second gate.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5; `npm trust` needs >= 11.10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Plan
        id: plan
        run: bun run release:plan -- --github-output

      # Dist is an input to publish, not a second quality gate. Check already
      # built, packed, and smoke-tested this tree; turbo replays that cache.
      - name: Build
        if: steps.plan.outputs.has_changes == 'true'
        timeout-minutes: 15
        run: bunx turbo run build --output-logs=errors-only

      # Vault is the source of truth. Reconciliation also repairs missing Trusted
      # Publishers and deprecations when there are no new package versions.
      # NPM_TOKEN is only needed to seed brand-new packages; release:publish already
      # tolerates it being unset and fails loudly itself when a new package needs it
      # (docs/SECRETS.md: bun run release:bootstrap). Don't let a missing/renamed Vault
      # key hard-fail every release run before that check gets a chance to run.
      - name: Load npm publish credential
        uses: hashicorp/vault-action@v4
        continue-on-error: true
        with:
          url: https://vault.chrisvouga.dev
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: https://vault.chrisvouga.dev
          secrets: |
            secret/data/personal/prd NPM_TOKEN | NPM_TOKEN

      - name: Publish, tag, and create GitHub Releases
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bun run release:publish
