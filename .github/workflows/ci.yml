# Local replica: bun run check
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Note push commitlint policy
        if: github.event_name == 'push'
        run: |
          set +e
          bunx commitlint --last --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::HEAD is not Conventional Commits. Enforced on PRs."
          fi

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          git rev-list --first-parent --reverse \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} |
          while read -r commit; do
            git show --no-patch --format=%B "$commit" | bunx commitlint --verbose
          done

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: .+
          subjectPatternError: |
            The PR title "{title}" looks empty after the type/scope prefix.
            Use a Conventional Commits title, e.g. "feat: add junction mock".

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run check:format

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Package integrity (publint + arethetypeswrong)
        run: bun run pack:check

      - name: Portability
        run: bun run portability

      - name: Boundaries
        run: bun run check:boundaries

  test:
    name: Test
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Property tests
        run: bun run test
        env:
          FC_NUM_RUNS: "40"

  # Trunk policy: `main` is the only long-lived branch, so every PR must target it and
  # must come from a short-lived head branch. Fail-closed: a PR whose head predates this
  # job never reports this context, so it stays blocked until it is synced with main.
  policy:
    name: PR Policy
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only PRs targeting main are allowed
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "::error::PR base is '$BASE_REF'; pull requests may only target 'main' (the trunk)."
            exit 1
          fi
          if [ "$HEAD_REF" = "main" ]; then
            echo "::error::PR head is 'main'; the head branch must be short-lived."
            exit 1
          fi
          echo "trunk policy satisfied: base=$BASE_REF head=$HEAD_REF"

  # Single required status check for branch protection / rulesets. Also asserts the trunk PR policy.
  required:
    name: Required
    if: always() && github.event_name == 'pull_request'
    needs: [commitlint, quality, test, policy]
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        run: |
          results=(
            "${{ needs.commitlint.result }}"
            "${{ needs.quality.result }}"
            "${{ needs.test.result }}"
            "${{ needs.policy.result }}"
          )
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "Required CI job failed (result=$result)"
              exit 1
            fi
          done
          echo "All required CI jobs passed"

  # Automated per-package release — scripts/release/lib.ts has the rules; docs/SECRETS.md the setup.
  # Changed packages (Conventional Commits since their `<name>@<version>` tag, plus dependents)
  # are versioned, published via npm Trusted Publishing (OIDC), tagged, and given a GitHub Release.
  # Nothing is committed to main: versions live in tags, like semantic-release.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commitlint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5; `npm trust` needs >= 11.10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plan
        id: plan
        run: bun run release:plan -- --github-output

      - name: Build
        if: steps.plan.outputs.has_changes == 'true'
        run: bun run build

      - name: Package integrity (publint + arethetypeswrong)
        if: steps.plan.outputs.has_changes == 'true'
        run: bun run pack:check

      - name: Portability
        if: steps.plan.outputs.has_changes == 'true'
        run: bun run portability

      - name: Configure git
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish, tag, and create GitHub Releases
        if: steps.plan.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish
