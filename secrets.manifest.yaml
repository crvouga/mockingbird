# Declarative inventory of release / maintainer credentials.
# Consumed by scripts/secrets/*.ts — never commit secret values.
#
# Source of truth: GitHub Actions repository secrets on crvouga/mockingbird. There is no
# self-hosted secret store. Anyone with write access to the repo can run every workflow that
# uses them (Release, Verify, Parity) without ever seeing a value.
#
# Live-parity sandbox keys are not listed here one by one: every env var that a
# packages/service/*/scripts/parity.ts loads (via `loadCredentials({ fields })`), and every name
# .env.example lists under a service heading, is a repo secret of the same name (e.g.
# STRIPE_SECRET_KEY). scripts/secrets/lib.ts discovers them; the Parity workflow maps each one
# it needs into the run. `bun run secrets:doctor` shows what is set.
#
# Locally, the same names go in .env.local (gitignored, auto-loaded by Bun). Nothing local is
# needed to build, test, or run `bun run check`.

repo: crvouga/mockingbird

secrets: []

checklists:
  - id: oidc_trusted_publishing
    description: npm Trusted Publishing (OIDC) — required for CI publish of each public package
    required: true
    urls:
      - https://docs.npmjs.com/trusted-publishers
    steps:
      - "For a new package, run bun run release:seed with an interactive npm login"
      - "The seed first-publishes it, then runs npm trust github"
      - "Manual equivalent, per public package: Settings → Trusted Publisher"
      - "Add GitHub Actions publisher"
      - "Organization/user: crvouga"
      - "Repository: mockingbird"
      - "Workflow filename: ci.yml"
      - "Environment: leave empty unless the release job uses one"
      - "Confirm release job has permissions.id-token: write"
