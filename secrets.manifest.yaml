# Declarative inventory of release / dry-run / parity credentials.
# Consumed by scripts/secrets/*.ts — never commit secret values.
#
# GitHub Actions publishes with npm Trusted Publishing (OIDC). NPM_TOKEN is only used
# to create brand-new packages (OIDC cannot) and attach their Trusted Publisher.
# Parity sandbox keys are loaded by @crvouga/mockingbird-openbao from the flat
# Vault/OpenBao secret secret/data/secret (UI: secret/secret), or MOCKINGBIRD_* env overrides.

repo: crvouga/mockingbird

secrets:
  - id: gh_pat
    description: Optional GitHub PAT for local dry-run tagging only
    required: false
    vault:
      path: personal/prd/github
      key: GH_PAT
    github:
      name: null
      required: false
    local_env:
      - GH_PAT
      - GITHUB_TOKEN
    obtain:
      title: Create a GitHub personal access token (optional, local only)
      urls:
        - https://github.com/settings/tokens
      steps:
        - "Fine-grained or classic PAT with repo contents as needed for local dry-run"
        - "CI uses the built-in GITHUB_TOKEN — no repo secret required for Actions"
    populate:
      vault: |
        export VAULT_ADDR=https://vault.chrisvouga.dev
        printf '%s' "$GH_PAT" | vault kv put -mount=secret personal/prd/github GH_PAT=-
      github: |
        # Not synced to GitHub Actions secrets (Actions uses GITHUB_TOKEN).
        export GITHUB_TOKEN="$(vault kv get -mount=secret -field=GH_PAT personal/prd/github)"

  - id: npm_token
    description: npm granular token that creates new @crvouga packages and attaches Trusted Publishers
    required: false
    vault:
      path: personal/prd
      key: NPM_TOKEN
    github:
      name: NPM_TOKEN
      required: false
    local_env:
      - NPM_TOKEN
    obtain:
      title: npm → Access Tokens → Generate New Token (Granular)
      urls:
        - https://www.npmjs.com/settings/crvouga/tokens/granular-access-tokens/new
        - https://docs.npmjs.com/trusted-publishers
      steps:
        - "Packages and scopes: Read and write, scope @crvouga (so it can create new packages)"
        - "Enable 'Bypass two-factor authentication' so CI can publish and run npm trust"
        - "Existing packages still publish via OIDC; this token is only a bootstrap/fallback"
    populate:
      vault: |
        export VAULT_ADDR=https://vault.chrisvouga.dev
        printf '%s' "$NPM_TOKEN" | vault kv patch -mount=secret personal/prd NPM_TOKEN=-
      github: |
        vault kv get -mount=secret -field=NPM_TOKEN personal/prd | gh secret set NPM_TOKEN --repo crvouga/mockingbird

  - id: stripe_secret_key
    description: Stripe test-mode secret for live parity (sk_test_*)
    required: false
    vault:
      path: secret
      key: MOCKINGBIRD_STRIPE_SECRET_KEY
    github:
      name: null
      required: false
    local_env:
      - MOCKINGBIRD_STRIPE_SECRET_KEY
      - MOCKINGBIRD_STRIPE_PUBLISHABLE_KEY
    obtain:
      title: Stripe Dashboard → Developers → API keys (test mode)
      urls:
        - https://dashboard.stripe.com/test/apikeys
        - https://docs.stripe.com/keys
      steps:
        - "Copy a sk_test_ secret key (and the pk_test_ publishable key)"
        - "Store as MOCKINGBIRD_STRIPE_SECRET_KEY under secret/secret (flat)"
        - "Optionally store the publishable key as MOCKINGBIRD_STRIPE_PUBLISHABLE_KEY"
    populate:
      vault: |
        export VAULT_ADDR=https://vault.chrisvouga.dev
        printf '%s' "$MOCKINGBIRD_STRIPE_SECRET_KEY" | vault kv put -mount=secret secret MOCKINGBIRD_STRIPE_SECRET_KEY=-
        printf '%s' "$MOCKINGBIRD_STRIPE_PUBLISHABLE_KEY" | vault kv put -mount=secret secret MOCKINGBIRD_STRIPE_PUBLISHABLE_KEY=-
      github: |
        # Prefer OpenBao/Vault at runtime; env override:
        export MOCKINGBIRD_STRIPE_SECRET_KEY="$(vault kv get -mount=secret -field=MOCKINGBIRD_STRIPE_SECRET_KEY secret)"
        export MOCKINGBIRD_STRIPE_PUBLISHABLE_KEY="$(vault kv get -mount=secret -field=MOCKINGBIRD_STRIPE_PUBLISHABLE_KEY secret)"

  - id: junction_api_key
    description: Junction sandbox team API key (sk_us_* / sk_eu_*)
    required: false
    vault:
      path: secret
      key: MOCKINGBIRD_JUNCTION_API_KEY
    github:
      name: null
      required: false
    local_env:
      - MOCKINGBIRD_JUNCTION_API_KEY
    obtain:
      title: Junction Dashboard → Team API keys (sandbox)
      urls:
        - https://docs.junction.com/api-details/junction-api
      steps:
        - "Create a sandbox Team API key (sk_us_* or sk_eu_*)"
        - "Store as MOCKINGBIRD_JUNCTION_API_KEY under secret/secret"
    populate:
      vault: |
        export VAULT_ADDR=https://vault.chrisvouga.dev
        printf '%s' "$MOCKINGBIRD_JUNCTION_API_KEY" | vault kv put -mount=secret secret MOCKINGBIRD_JUNCTION_API_KEY=-
      github: |
        export MOCKINGBIRD_JUNCTION_API_KEY="$(vault kv get -mount=secret -field=MOCKINGBIRD_JUNCTION_API_KEY secret)"

  - id: genebygene_client
    description: GeneByGene staging OAuth client_id + client_secret
    required: false
    vault:
      path: secret
      key: client_id
    github:
      name: null
      required: false
    local_env:
      - MOCKINGBIRD_GENEBYGENE_CLIENT_ID
      - MOCKINGBIRD_GENEBYGENE_CLIENT_SECRET
    obtain:
      title: GeneByGene tenant credentials (staging)
      urls:
        - https://api.genebygene.com/assets/GxG%20API%20Services%20Developer%20Guide%202022.pdf
        - https://api.genebygene.com/swagger/index.html
      steps:
        - "Receive staging client_id / client_secret from GeneByGene"
        - "Store client_id and client_secret under secret/secret"
    populate:
      vault: |
        export VAULT_ADDR=https://vault.chrisvouga.dev
        vault kv put -mount=secret secret \
          client_id="$MOCKINGBIRD_GENEBYGENE_CLIENT_ID" \
          client_secret="$MOCKINGBIRD_GENEBYGENE_CLIENT_SECRET"
      github: |
        export MOCKINGBIRD_GENEBYGENE_CLIENT_ID="$(vault kv get -mount=secret -field=client_id secret)"
        export MOCKINGBIRD_GENEBYGENE_CLIENT_SECRET="$(vault kv get -mount=secret -field=client_secret secret)"

checklists:
  - id: oidc_trusted_publishing
    description: npm Trusted Publishing (OIDC) — required for CI publish of each public package
    required: true
    urls:
      - https://www.npmjs.com/package/@crvouga/mockingbird
      - https://docs.npmjs.com/trusted-publishers
    steps:
      - "Automatic when NPM_TOKEN is set: release:publish runs npm trust github for each package"
      - "Manual fallback, per public package: Settings → Trusted Publisher"
      - "Add GitHub Actions publisher"
      - "Organization/user: crvouga"
      - "Repository: mockingbird"
      - "Workflow filename: ci.yml"
      - "Environment: leave empty unless the release job uses one"
      - "Confirm release job has permissions.id-token: write"
      - "Without NPM_TOKEN, seed new packages locally: bun run release:seed"
