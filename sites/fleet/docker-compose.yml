# Self-hosting reference: the image plus PostgreSQL. Bring any S3-compatible object store that
# supports conditional writes (If-Match / If-None-Match), such as Cloudflare R2 or AWS S3:
#   S3_ENDPOINT=… S3_REGION=… S3_ACCESS_KEY_ID=… S3_SECRET_ACCESS_KEY=… S3_BUCKET=… \
#     docker compose -f sites/fleet/docker-compose.yml up --build
# Then open http://localhost:8080. Sign-in here is the loopback-only dev login; for a real
# deployment set PUBLIC_URL to your https origin and OIDC_ISSUER / OIDC_CLIENT_ID to your
# OpenID Connect provider (a public client with PKCE), and remove AUTH_DEV_LOGIN.
services:
  fleet:
    build:
      context: ../..
      dockerfile: sites/fleet/Dockerfile
    ports: ["8080:8080"]
    environment:
      PUBLIC_URL: http://localhost:8080
      AUTH_DEV_LOGIN: "1"
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to an S3-compatible endpoint}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet, POSTGRES_DB: fleet }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 2s
      retries: 30
